<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px;
    }

    .upload-box {
      background: #1b1b1b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      margin-top: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .upload-btn {
      background: #1db954;
      color: white;
    }

    .edit-btn {
      background: #3498db;
      color: white;
      margin-right: 8px;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .cancel-btn {
      background: #555;
      color: white;
      margin-left: 8px;
    }

    .song {
      background: #1b1b1b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .cover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }

    .no-cover {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .artist {
      color: #aaa;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
      margin-top: 5px;
    }

    .edit-form {
      display: none;
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .edit-form.show {
      display: block;
    }

    .message {
      margin-top: 10px;
      color: #1db954;
    }

    .error {
      color: #ff6b6b;
    }

    .search-box {
      margin-bottom: 25px;
    }

    .search-box input {
      margin: 0;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      .song {
        align-items: flex-start;
      }

      .cover,
      .no-cover {
        width: 70px;
        height: 70px;
      }

      .song {
        flex-wrap: wrap;
      }

      .song-info {
        min-width: 200px;
      }

      audio {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
</header>

<div class="container">

  <!-- ================================
       ADD NEW SONG
  ================================= -->

  <div class="upload-box">

    <h2>Add New Song</h2>

    <input
      type="text"
      id="songTitle"
      placeholder="Song title"
    >

    <input
      type="text"
      id="artist"
      placeholder="Artist"
    >

    <label>Music file:</label>

    <input
      type="file"
      id="musicFile"
      accept="audio/*"
    >

    <label>Cover image:</label>

    <input
      type="file"
      id="coverFile"
      accept="image/*"
    >

    <button
      id="uploadButton"
      class="upload-btn"
      type="button"
    >
      Upload Song
    </button>

    <div
      id="uploadMessage"
      class="message">
    </div>

  </div>


  <!-- ================================
       SEARCH
  ================================= -->

  <div class="search-box">

    <input
      type="text"
      id="search"
      placeholder="🔎 Search songs or artists..."
    >

  </div>


  <h2>Your Songs</h2>

  <div id="songs">
    <p>Loading songs...</p>
  </div>

</div>


<script>

  // =====================================
  // SUPABASE
  // =====================================

  const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================
  // ELEMENTS
  // =====================================

  const songsContainer =
    document.getElementById("songs");

  const searchInput =
    document.getElementById("search");

  const uploadButton =
    document.getElementById("uploadButton");

  const uploadMessage =
    document.getElementById("uploadMessage");

  const songTitleInput =
    document.getElementById("songTitle");

  const artistInput =
    document.getElementById("artist");

  const musicFileInput =
    document.getElementById("musicFile");

  const coverFileInput =
    document.getElementById("coverFile");


  let allSongs = [];


  // =====================================
  // LOAD SONGS
  // =====================================

  async function loadSongs() {

    songsContainer.innerHTML =
      "<p>Loading songs...</p>";


    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      console.error(error);

      songsContainer.innerHTML =
        `<p class="error">
          Could not load songs: ${escapeHtml(error.message)}
        </p>`;

      return;
    }


    allSongs = data || [];

    displaySongs(allSongs);

  }


  // =====================================
  // DISPLAY SONGS
  // =====================================

  function displaySongs(songList) {

    songsContainer.innerHTML = "";


    if (!songList || songList.length === 0) {

      songsContainer.innerHTML =
        "<p>No songs found.</p>";

      return;
    }


    songList.forEach(song => {

      const div =
        document.createElement("div");

      div.className = "song";


      // =====================================
      // COVER
      // =====================================

      let coverElement;


      if (song.cover_url) {

        coverElement =
          document.createElement("img");

        coverElement.className =
          "cover";

        coverElement.src =
          song.cover_url;

        coverElement.alt =
          "Cover";

        coverElement.onerror =
          function() {

            this.style.display = "none";

            const placeholder =
              document.createElement("div");

            placeholder.className =
              "no-cover";

            placeholder.textContent =
              "🎵";

            this.parentNode.insertBefore(
              placeholder,
              this
            );

          };

      } else {

        coverElement =
          document.createElement("div");

        coverElement.className =
          "no-cover";

        coverElement.textContent =
          "🎵";

      }


      div.appendChild(
        coverElement
      );


      // =====================================
      // SONG INFORMATION
      // =====================================

      const info =
        document.createElement("div");

      info.className =
        "song-info";


      const title =
        document.createElement("div");

      title.className =
        "song-title";

      title.textContent =
        song.title || "Untitled";


      const artist =
        document.createElement("div");

      artist.className =
        "artist";

      artist.textContent =
        song.artist || "Unknown Artist";


      info.appendChild(title);

      info.appendChild(artist);


      // =====================================
      // MUSIC PLAYER
      // =====================================

      if (song.file_path) {

        const musicUrl =
          supabaseClient
            .storage
            .from("music")
            .getPublicUrl(
              song.file_path
            )
            .data.publicUrl;


        const audio =
          document.createElement("audio");

        audio.controls = true;

        audio.src =
          musicUrl;

        audio.preload =
          "metadata";


        info.appendChild(audio);

      }


      // =====================================
      // BUTTONS
      // =====================================

      const buttons =
        document.createElement("div");


      // EDIT BUTTON

      const editButton =
        document.createElement("button");

      editButton.type =
        "button";

      editButton.className =
        "edit-btn";

      editButton.textContent =
        "✏️ Edit";


      editButton.addEventListener(
        "click",
        function() {

          showEditForm(
            song,
            editForm
          );

        }
      );


      // DELETE BUTTON

      const deleteButton =
        document.createElement("button");

      deleteButton.type =
        "button";

      deleteButton.className =
        "delete-btn";

      deleteButton.textContent =
        "🗑️ Delete";


      deleteButton.addEventListener(
        "click",
        function() {

          deleteSong(
            song.id
          );

        }
      );


      buttons.appendChild(
        editButton
      );

      buttons.appendChild(
        deleteButton
      );


      info.appendChild(
        buttons
      );


      // =====================================
      // EDIT FORM
      // =====================================

      const editForm =
        document.createElement("div");

      editForm.className =
        "edit-form";


      const editTitle =
        document.createElement("input");

      editTitle.type =
        "text";

      editTitle.value =
        song.title || "";

      editTitle.placeholder =
        "Song title";


      const editArtist =
        document.createElement("input");

      editArtist.type =
        "text";

      editArtist.value =
        song.artist || "";

      editArtist.placeholder =
        "Artist";


      const coverLabel =
        document.createElement("label");

      coverLabel.textContent =
        "New cover image:";


      const editCover =
        document.createElement("input");

      editCover.type =
        "file";

      editCover.accept =
        "image/*";


      const saveButton =
        document.createElement("button");

      saveButton.type =
        "button";

      saveButton.className =
        "upload-btn";

      saveButton.textContent =
        "💾 Save Changes";


      saveButton.addEventListener(
        "click",
        function() {

          saveEdit(
            song.id,
            editTitle,
            editArtist,
            editCover,
            saveButton
          );

        }
      );


      const cancelButton =
        document.createElement("button");

      cancelButton.type =
        "button";

      cancelButton.className =
        "cancel-btn";

      cancelButton.textContent =
        "Cancel";


      cancelButton.addEventListener(
        "click",
        function() {

          editForm.classList.remove(
            "show"
          );

        }
      );


      editForm.appendChild(
        editTitle
      );

      editForm.appendChild(
        editArtist
      );

      editForm.appendChild(
        coverLabel
      );

      editForm.appendChild(
        editCover
      );

      editForm.appendChild(
        saveButton
      );

      editForm.appendChild(
        cancelButton
      );


      info.appendChild(
        editForm
      );


      // =====================================
      // FINISH SONG
      // =====================================

      div.appendChild(
        info
      );

      songsContainer.appendChild(
        div
      );

    });

  }


  // =====================================
  // SHOW EDIT FORM
  // =====================================

  function showEditForm(
    song,
    form
  ) {

    form.classList.add(
      "show"
    );

  }


  // =====================================
  // SAVE EDIT
  // =====================================

  async function saveEdit(
    id,
    titleInput,
    artistInput,
    coverInput,
    saveButton
  ) {

    const title =
      titleInput.value.trim();

    const artist =
      artistInput.value.trim();


    if (!title) {

      alert(
        "Please enter a song title."
      );

      return;
    }


    saveButton.disabled =
      true;

    saveButton.textContent =
      "Saving...";


    try {

      let updateData = {

        title: title,

        artist: artist

      };


      // =====================================
      // UPLOAD NEW COVER
      // =====================================

      if (
        coverInput.files.length > 0
      ) {

        const file =
          coverInput.files[0];


        if (
          !file.type.startsWith("image/")
        ) {

          alert(
            "Please select an image file."
          );

          return;
        }


        const fileName =
          "covers/" +
          Date.now() +
          "_" +
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const { error: uploadError } =
          await supabaseClient
            .storage
            .from("music")
            .upload(
              fileName,
              file,
              {
                upsert: true
              }
            );


        if (uploadError) {

          alert(
            "Cover upload failed: " +
            uploadError.message
          );

          return;
        }


        const publicUrl =
          supabaseClient
            .storage
            .from("music")
            .getPublicUrl(
              fileName
            )
            .data.publicUrl;


        updateData.cover_url =
          publicUrl;

      }


      // =====================================
      // UPDATE DATABASE
      // =====================================

      const { error } =
        await supabaseClient
          .from("songs")
          .update(updateData)
          .eq("id", id);


      if (error) {

        alert(
          "Could not save changes: " +
          error.message
        );

        return;
      }


      alert(
        "Song updated successfully! 🎉"
      );


      await loadSongs();

    }

    catch (error) {

      console.error(error);

      alert(
        "Something went wrong: " +
        error.message
      );

    }

    finally {

      saveButton.disabled =
        false;

      saveButton.textContent =
        "💾 Save Changes";

    }

  }


  // =====================================
  // UPLOAD NEW SONG
  // =====================================

  uploadButton.addEventListener(
    "click",
    uploadSong
  );


  async function uploadSong() {

    const title =
      songTitleInput.value.trim();

    const artist =
      artistInput.value.trim();

    const musicFile =
      musicFileInput.files[0];

    const coverFile =
      coverFileInput.files[0];


    if (
      !title ||
      !artist ||
      !musicFile
    ) {

      uploadMessage.textContent =
        "Please enter the title, artist, and music file.";

      return;
    }


    if (
      !musicFile.type.startsWith("audio/")
    ) {

      uploadMessage.textContent =
        "Please select an audio file.";

      return;
    }


    uploadButton.disabled =
      true;

    uploadButton.textContent =
      "Uploading...";

    uploadMessage.textContent =
      "";


    try {

      // =====================================
      // MUSIC FILE
      // =====================================

      const musicName =
        "songs/" +
        Date.now() +
        "_" +
        musicFile.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const { error: musicError } =
        await supabaseClient
          .storage
          .from("music")
          .upload(
            musicName,
            musicFile
          );


      if (musicError) {

        throw new Error(
          "Music upload failed: " +
          musicError.message
        );

      }


      // =====================================
      // COVER
      // =====================================

      let coverUrl = "";


      if (coverFile) {

        if (
          !coverFile.type.startsWith("image/")
        ) {

          throw new Error(
            "Please select a valid image file."
          );

        }


        const coverName =
          "covers/" +
          Date.now() +
          "_" +
          coverFile.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const { error: coverError } =
          await supabaseClient
            .storage
            .from("music")
            .upload(
              coverName,
              coverFile
            );


        if (coverError) {

          throw new Error(
            "Cover upload failed: " +
            coverError.message
          );

        }


        coverUrl =
          supabaseClient
            .storage
            .from("music")
            .getPublicUrl(
              coverName
            )
            .data.publicUrl;

      }


      // =====================================
      // DATABASE
      // =====================================

      const { error: databaseError } =
        await supabaseClient
          .from("songs")
          .insert([
            {

              title: title,

              file_path:
                musicName,

              artist: artist,

              cover_url:
                coverUrl

            }
          ]);


      if (databaseError) {

        throw new Error(
          "Database error: " +
          databaseError.message
        );

      }


      uploadMessage.textContent =
        "Song uploaded successfully! 🎉";


      songTitleInput.value =
        "";

      artistInput.value =
        "";

      musicFileInput.value =
        "";

      coverFileInput.value =
        "";


      await loadSongs();

    }

    catch (error) {

      console.error(error);

      uploadMessage.textContent =
        error.message;

      uploadMessage.classList.add(
        "error"
      );

    }

    finally {

      uploadButton.disabled =
        false;

      uploadButton.textContent =
        "Upload Song";

    }

  }


  // =====================================
  // DELETE SONG
  // =====================================

  async function deleteSong(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this song?"
      );


    if (!confirmed) {

      return;
    }


    const { error } =
      await supabaseClient
        .from("songs")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Could not delete song: " +
        error.message
      );

      return;
    }


    alert(
      "Song deleted successfully."
    );


    await loadSongs();

  }


  // =====================================
  // SEARCH
  // =====================================

  searchInput.addEventListener(
    "input",
    function() {

      const searchText =
        searchInput.value
          .toLowerCase()
          .trim();


      if (!searchText) {

        displaySongs(
          allSongs
        );

        return;
      }


      const filtered =
        allSongs.filter(song => {

          const title =
            (song.title || "")
              .toLowerCase();

          const artist =
            (song.artist || "")
              .toLowerCase();


          return (
            title.includes(searchText) ||
            artist.includes(searchText)
          );

        });


      displaySongs(
        filtered
      );

    }
  );


  // =====================================
  // SECURITY
  // =====================================

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;

  }


  // =====================================
  // START
  // =====================================

  loadSongs();

</script>

</body>
</html>
