<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px;
    }

    .upload-box {
      background: #1b1b1b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      margin-top: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .green {
      background: #1db954;
      color: white;
    }

    .blue {
      background: #3498db;
      color: white;
    }

    .red {
      background: #e74c3c;
      color: white;
    }

    .gray {
      background: #555;
      color: white;
    }

    .song {
      background: #1b1b1b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
      align-items: flex-start;
    }

    .cover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }

    .placeholder {
      width: 90px;
      height: 90px;
      background: #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .artist {
      color: #aaa;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
    }

    .edit-form {
      display: none;
      background: #252525;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .edit-form.show {
      display: block;
    }

    .message {
      margin-top: 10px;
    }

    .error {
      color: #ff6b6b;
    }

    .search {
      margin-bottom: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
</header>

<div class="container">

  <!-- =====================================
       ADD NEW SONG
  ====================================== -->

  <div class="upload-box">

    <h2>Add New Song</h2>

    <input
      id="songTitle"
      type="text"
      placeholder="Song title"
    >

    <input
      id="artist"
      type="text"
      placeholder="Artist"
    >

    <label>Music file:</label>

    <input
      id="musicFile"
      type="file"
      accept="audio/*"
    >

    <label>Cover image:</label>

    <input
      id="coverFile"
      type="file"
      accept="image/*"
    >

    <button
      id="uploadButton"
      class="green"
      type="button"
    >
      Upload Song
    </button>

    <div
      id="uploadMessage"
      class="message"
    ></div>

  </div>


  <!-- =====================================
       SEARCH
  ====================================== -->

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Search songs or artists..."
  >


  <h2>Your Songs</h2>

  <div id="songs">
    Loading songs...
  </div>

</div>


<script>

  // =====================================
  // SUPABASE CONNECTION
  // =====================================

  const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let allSongs = [];


  // =====================================
  // LOAD SONGS
  // =====================================

  async function loadSongs() {

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      document.getElementById("songs").innerHTML =
        `<p class="error">
          ${escapeHtml(error.message)}
        </p>`;

      return;
    }


    allSongs = data || [];

    displaySongs(allSongs);

  }


  // =====================================
  // DISPLAY SONGS
  // =====================================

  function displaySongs(list) {

    const container =
      document.getElementById("songs");

    container.innerHTML = "";


    if (list.length === 0) {

      container.innerHTML =
        "<p>No songs found.</p>";

      return;
    }


    list.forEach(song => {

      const row =
        document.createElement("div");

      row.className =
        "song";


      // =====================================
      // COVER
      // =====================================

      if (song.cover_url) {

        const img =
          document.createElement("img");

        img.className =
          "cover";

        img.src =
          song.cover_url;

        img.alt =
          "Cover";

        img.onerror =
          function() {

            this.replaceWith(
              makePlaceholder()
            );

          };

        row.appendChild(img);

      } else {

        row.appendChild(
          makePlaceholder()
        );

      }


      // =====================================
      // INFORMATION
      // =====================================

      const info =
        document.createElement("div");

      info.className =
        "song-info";


      const title =
        document.createElement("div");

      title.className =
        "title";

      title.textContent =
        song.title || "Untitled";


      const artist =
        document.createElement("div");

      artist.className =
        "artist";

      artist.textContent =
        song.artist || "Unknown Artist";


      info.appendChild(title);

      info.appendChild(artist);


      // =====================================
      // MUSIC PLAYER
      // =====================================

      if (song.file_path) {

        const musicUrl =
          supabaseClient
            .storage
            .from("music")
            .getPublicUrl(
              song.file_path
            )
            .data.publicUrl;


        const audio =
          document.createElement("audio");

        audio.controls =
          true;

        audio.preload =
          "metadata";

        audio.src =
          musicUrl;


        info.appendChild(audio);

      }


      // =====================================
      // BUTTONS
      // =====================================

      const buttonArea =
        document.createElement("div");


      const editButton =
        document.createElement("button");

      editButton.className =
        "blue";

      editButton.type =
        "button";

      editButton.textContent =
        "✏️ Edit";


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "red";

      deleteButton.type =
        "button";

      deleteButton.textContent =
        "🗑️ Delete";


      buttonArea.appendChild(
        editButton
      );

      buttonArea.appendChild(
        deleteButton
      );


      info.appendChild(
        buttonArea
      );


      // =====================================
      // EDIT FORM
      // =====================================

      const editForm =
        document.createElement("div");

      editForm.className =
        "edit-form";


      const editTitle =
        document.createElement("input");

      editTitle.type =
        "text";

      editTitle.value =
        song.title || "";

      editTitle.placeholder =
        "Song title";


      const editArtist =
        document.createElement("input");

      editArtist.type =
        "text";

      editArtist.value =
        song.artist || "";

      editArtist.placeholder =
        "Artist";


      const coverLabel =
        document.createElement("label");

      coverLabel.textContent =
        "New cover image:";


      const editCover =
        document.createElement("input");

      editCover.type =
        "file";

      editCover.accept =
        "image/*";


      const saveButton =
        document.createElement("button");

      saveButton.className =
        "green";

      saveButton.type =
        "button";

      saveButton.textContent =
        "💾 Save Changes";


      const cancelButton =
        document.createElement("button");

      cancelButton.className =
        "gray";

      cancelButton.type =
        "button";

      cancelButton.textContent =
        "Cancel";


      editForm.appendChild(
        editTitle
      );

      editForm.appendChild(
        editArtist
      );

      editForm.appendChild(
        coverLabel
      );

      editForm.appendChild(
        editCover
      );

      editForm.appendChild(
        saveButton
      );

      editForm.appendChild(
        cancelButton
      );


      info.appendChild(
        editForm
      );


      // =====================================
      // EDIT BUTTON
      // =====================================

      editButton.addEventListener(
        "click",
        function() {

          editForm.classList.toggle(
            "show"
          );

        }
      );


      // =====================================
      // CANCEL
      // =====================================

      cancelButton.addEventListener(
        "click",
        function() {

          editForm.classList.remove(
            "show"
          );

        }
      );


      // =====================================
      // SAVE EDIT
      // =====================================

      saveButton.addEventListener(
        "click",
        async function() {

          await saveEdit(
            song,
            editTitle,
            editArtist,
            editCover,
            saveButton
          );

        }
      );


      // =====================================
      // DELETE
      // =====================================

      deleteButton.addEventListener(
        "click",
        async function() {

          await deleteSong(
            song.id
          );

        }
      );


      row.appendChild(info);

      container.appendChild(row);

    });

  }


  // =====================================
  // PLACEHOLDER
  // =====================================

  function makePlaceholder() {

    const div =
      document.createElement("div");

    div.className =
      "placeholder";

    div.textContent =
      "🎵";

    return div;

  }


  // =====================================
  // SAVE EDIT
  // =====================================

  async function saveEdit(
    song,
    titleInput,
    artistInput,
    coverInput,
    button
  ) {

    const title =
      titleInput.value.trim();

    const artist =
      artistInput.value.trim();


    if (!title) {

      alert(
        "Please enter a song title."
      );

      return;
    }


    button.disabled =
      true;

    button.textContent =
      "Saving...";


    try {

      let coverUrl =
        song.cover_url || "";


      // =====================================
      // UPLOAD COVER TO COVERS BUCKET
      // =====================================

      if (
        coverInput.files &&
        coverInput.files.length > 0
      ) {

        const file =
          coverInput.files[0];


        if (
          !file.type.startsWith("image/")
        ) {

          throw new Error(
            "Please select an image file."
          );

        }


        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const coverPath =
          "covers/" +
          Date.now() +
          "-" +
          safeName;


        const result =
          await supabaseClient
            .storage
            .from("covers")
            .upload(
              coverPath,
              file,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (result.error) {

          throw new Error(
            "COVER UPLOAD ERROR: " +
            result.error.message
          );

        }


        coverUrl =
          supabaseClient
            .storage
            .from("covers")
            .getPublicUrl(
              coverPath
            )
            .data.publicUrl;

      }


      // =====================================
      // UPDATE DATABASE
      // =====================================

      const result =
        await supabaseClient
          .from("songs")
          .update({

            title: title,

            artist: artist,

            cover_url: coverUrl

          })
          .eq(
            "id",
            song.id
          );


      if (result.error) {

        throw new Error(
          "DATABASE UPDATE ERROR: " +
          result.error.message
        );

      }


      alert(
        "Song updated successfully! 🎉"
      );


      await loadSongs();

    }

    catch (error) {

      console.error(error);

      alert(
        error.message
      );

    }

    finally {

      button.disabled =
        false;

      button.textContent =
        "💾 Save Changes";

    }

  }


  // =====================================
  // UPLOAD NEW SONG
  // =====================================

  document
    .getElementById("uploadButton")
    .addEventListener(
      "click",
      uploadSong
    );


  async function uploadSong() {

    const title =
      document
        .getElementById("songTitle")
        .value
        .trim();

    const artist =
      document
        .getElementById("artist")
        .value
        .trim();

    const musicFile =
      document
        .getElementById("musicFile")
        .files[0];

    const coverFile =
      document
        .getElementById("coverFile")
        .files[0];

    const message =
      document
        .getElementById("uploadMessage");


    if (
      !title ||
      !artist ||
      !musicFile
    ) {

      message.textContent =
        "Please enter the title, artist, and music file.";

      return;
    }


    try {

      message.textContent =
        "Uploading music...";


      // =====================================
      // MUSIC → music BUCKET
      // =====================================

      const musicPath =
        "songs/" +
        Date.now() +
        "-" +
        musicFile.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const musicResult =
        await supabaseClient
          .storage
          .from("music")
          .upload(
            musicPath,
            musicFile
          );


      if (musicResult.error) {

        throw new Error(
          "MUSIC UPLOAD ERROR: " +
          musicResult.error.message
        );

      }


      // =====================================
      // COVER → covers BUCKET
      // =====================================

      let coverUrl = "";


      if (coverFile) {

        message.textContent =
          "Uploading cover...";


        if (
          !coverFile.type.startsWith("image/")
        ) {

          throw new Error(
            "Please select a valid image file."
          );

        }


        const coverPath =
          "covers/" +
          Date.now() +
          "-" +
          coverFile.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const coverResult =
          await supabaseClient
            .storage
            .from("covers")
            .upload(
              coverPath,
              coverFile
            );


        if (coverResult.error) {

          throw new Error(
            "COVER UPLOAD ERROR: " +
            coverResult.error.message
          );

        }


        coverUrl =
          supabaseClient
            .storage
            .from("covers")
            .getPublicUrl(
              coverPath
            )
            .data.publicUrl;

      }


      // =====================================
      // SAVE SONG RECORD
      // =====================================

      const databaseResult =
        await supabaseClient
          .from("songs")
          .insert({

            title: title,

            artist: artist,

            file_path:
              musicPath,

            cover_url:
              coverUrl

          });


      if (databaseResult.error) {

        throw new Error(
          "DATABASE ERROR: " +
          databaseResult.error.message
        );

      }


      message.textContent =
        "Song uploaded successfully! 🎉";


      // CLEAR FORM

      document.getElementById(
        "songTitle"
      ).value = "";

      document.getElementById(
        "artist"
      ).value = "";

      document.getElementById(
        "musicFile"
      ).value = "";

      document.getElementById(
        "coverFile"
      ).value = "";


      await loadSongs();

    }

    catch (error) {

      console.error(error);

      message.textContent =
        error.message;

      message.className =
        "message error";

    }

  }


  // =====================================
  // SEARCH
  // =====================================

  document
    .getElementById("search")
    .addEventListener(
      "input",
      function() {

        const text =
          this.value
            .toLowerCase()
            .trim();


        if (!text) {

          displaySongs(
            allSongs
          );

          return;
        }


        const filtered =
          allSongs.filter(song => {

            return (
              (song.title || "")
                .toLowerCase()
                .includes(text) ||

              (song.artist || "")
                .toLowerCase()
                .includes(text)
            );

          });


        displaySongs(
          filtered
        );

      }
    );


  // =====================================
  // DELETE
  // =====================================

  async function deleteSong(id) {

    if (
      !confirm(
        "Are you sure you want to delete this song?"
      )
    ) {

      return;
    }


    const result =
      await supabaseClient
        .from("songs")
        .delete()
        .eq(
          "id",
          id
        );


    if (result.error) {

      alert(
        "DELETE ERROR: " +
        result.error.message
      );

      return;
    }


    await loadSongs();

  }


  // =====================================
  // START
  // =====================================

  loadSongs();

</script>

</body>
</html>
