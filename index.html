<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      padding-bottom: 125px;
    }

    header {
      background: linear-gradient(135deg, #171717, #101010);
      padding: 35px 25px;
      border-bottom: 1px solid #292929;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #aaa;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px;
    }

    .hero {
      background:
        radial-gradient(circle at top right, #5d32a8, transparent 40%),
        linear-gradient(135deg, #252525, #171717);
      padding: 35px;
      border-radius: 20px;
      margin-bottom: 25px;
      border: 1px solid #303030;
    }

    .hero h2 {
      margin-top: 0;
      font-size: 28px;
    }

    .hero p {
      color: #bbb;
    }

    .upload {
      display: inline-block;
      background: white;
      color: black;
      padding: 13px 22px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    input[type="file"] {
      display: none;
    }

    .search {
      width: 100%;
      padding: 16px 20px;
      margin-bottom: 25px;
      border-radius: 14px;
      border: 1px solid #303030;
      background: #181818;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .search:focus {
      border-color: #8b5cf6;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #171717;
      padding: 13px;
      margin-bottom: 10px;
      border-radius: 14px;
      border: 1px solid #242424;
      transition: 0.2s;
    }

    .song:hover {
      background: #202020;
    }

    .album-art {
      width: 58px;
      height: 58px;
      min-width: 58px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #7c3aed, #181818);
      font-size: 25px;
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      color: #888;
      font-size: 13px;
      margin-top: 5px;
    }

    .play-button {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      cursor: pointer;
      font-size: 17px;
    }

    .favorite {
      background: transparent;
      border: none;
      color: #777;
      font-size: 21px;
      cursor: pointer;
    }

    .favorite:hover {
      color: white;
    }

    .message {
      color: #888;
      padding: 30px 0;
      text-align: center;
    }

    /* UPLOAD FORM */

    .upload-form {
      display: none;
      margin-top: 25px;
      padding: 25px;
      background: #151515;
      border: 1px solid #333;
      border-radius: 15px;
    }

    .upload-form.show {
      display: block;
    }

    .upload-form h3 {
      margin-top: 0;
    }

    .form-input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #222;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .form-input:focus {
      border-color: #8b5cf6;
    }

    .file-label {
      display: block;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px dashed #555;
      border-radius: 10px;
      background: #1e1e1e;
      cursor: pointer;
      color: #ccc;
    }

    .file-label:hover {
      border-color: #8b5cf6;
    }

    .submit-button {
      background: white;
      color: black;
      border: none;
      padding: 13px 22px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    .cancel-button {
      background: #333;
      color: white;
      border: none;
      padding: 13px 22px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 8px;
    }

    #uploadStatus {
      margin-top: 15px;
      color: #aaa;
    }

    /* PLAYER */

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(20, 20, 20, 0.97);
      border-top: 1px solid #333;
      padding: 12px 20px;
      z-index: 1000;
    }

    .player-content {
      max-width: 1000px;
      margin: auto;
    }

    #nowPlaying {
      font-weight: bold;
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
    }

    @media (max-width: 600px) {

      header {
        padding: 25px 20px;
      }

      header h1 {
        font-size: 27px;
      }

      .container {
        padding: 20px 15px;
      }

      .hero {
        padding: 25px;
      }

      .hero h2 {
        font-size: 23px;
      }

      .song {
        gap: 10px;
      }

      .album-art {
        width: 50px;
        height: 50px;
        min-width: 50px;
      }

      .favorite {
        display: none;
      }

      .cancel-button {
        margin-left: 0;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
  <p>Your personal music streaming library</p>
</header>


<div class="container">

  <div class="hero">

    <h2>Listen to music your way.</h2>

    <p>
      Upload your music, add an artist and cover, and stream it directly from your website.
    </p>

    <button class="upload" id="addMusicButton">
      + Add Music
    </button>


    <!-- UPLOAD FORM -->

    <div class="upload-form" id="uploadForm">

      <h3>🎵 Add a New Song</h3>

      <input
        type="text"
        id="songTitle"
        class="form-input"
        placeholder="Song title"
      >

      <input
        type="text"
        id="artistName"
        class="form-input"
        placeholder="Artist name"
      >


      <label class="file-label">
        🖼️ Choose Cover Artwork

        <input
          type="file"
          id="coverInput"
          accept="image/*"
        >
      </label>


      <label class="file-label">
        🎧 Choose Music File

        <input
          type="file"
          id="fileInput"
          accept="audio/*"
        >
      </label>


      <button
        class="submit-button"
        id="uploadButton"
      >
        Upload Song
      </button>


      <button
        class="cancel-button"
        id="cancelButton"
      >
        Cancel
      </button>


      <div id="uploadStatus"></div>

    </div>

  </div>


  <input
    id="search"
    class="search"
    placeholder="🔎 Search your music..."
  >


  <h2 class="section-title">
    Your Music
  </h2>


  <div id="songs">
    <div class="message">
      Loading your music...
    </div>
  </div>

</div>


<!-- PLAYER -->

<div class="player">

  <div class="player-content">

    <div id="nowPlaying">
      Nothing playing
    </div>

    <audio id="audio" controls></audio>

  </div>

</div>


<script>

  // =====================================
  // SUPABASE CONNECTION
  // =====================================

  const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================
  // ELEMENTS
  // =====================================

  const addMusicButton =
    document.getElementById("addMusicButton");

  const uploadForm =
    document.getElementById("uploadForm");

  const cancelButton =
    document.getElementById("cancelButton");

  const uploadButton =
    document.getElementById("uploadButton");

  const fileInput =
    document.getElementById("fileInput");

  const coverInput =
    document.getElementById("coverInput");

  const songTitle =
    document.getElementById("songTitle");

  const artistName =
    document.getElementById("artistName");

  const uploadStatus =
    document.getElementById("uploadStatus");

  const songsContainer =
    document.getElementById("songs");

  const audio =
    document.getElementById("audio");

  const nowPlaying =
    document.getElementById("nowPlaying");

  const search =
    document.getElementById("search");


  let songs = [];


  // =====================================
  // SHOW UPLOAD FORM
  // =====================================

  addMusicButton.addEventListener(
    "click",
    () => {

      uploadForm.classList.add("show");

      songTitle.focus();

    }
  );


  // =====================================
  // HIDE UPLOAD FORM
  // =====================================

  cancelButton.addEventListener(
    "click",
    () => {

      uploadForm.classList.remove("show");

      songTitle.value = "";
      artistName.value = "";
      fileInput.value = "";
      coverInput.value = "";
      uploadStatus.textContent = "";

    }
  );


  // =====================================
  // LOAD MUSIC
  // =====================================

  async function loadSongs() {

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      songsContainer.innerHTML =
        `<div class="message">
          Could not load music:
          ${escapeHtml(error.message)}
        </div>`;

      return;
    }


    songs = data || [];

    displaySongs();

  }


  // =====================================
  // DISPLAY SONGS
  // =====================================

  function displaySongs(filter = "") {

    songsContainer.innerHTML = "";


    const filteredSongs =
      songs.filter(song => {

        const title =
          song.title || "";

        const artist =
          song.artist || "";

        const searchText =
          title + " " + artist;

        return searchText
          .toLowerCase()
          .includes(filter.toLowerCase());

      });


    if (filteredSongs.length === 0) {

      songsContainer.innerHTML =
        `<div class="message">
          No music uploaded yet.
        </div>`;

      return;
    }


    filteredSongs.forEach(song => {

      const row =
        document.createElement("div");

      row.className = "song";


      let coverHTML =
        `<div class="album-art">🎵</div>`;


      if (song.cover_url) {

        coverHTML =
          `<div class="album-art">
            <img
              src="${escapeHtml(song.cover_url)}"
              alt="Cover"
            >
          </div>`;

      }


      row.innerHTML = `

        ${coverHTML}

        <div class="song-info">

          <div class="song-name">
            ${escapeHtml(song.title || "Untitled")}
          </div>

          <div class="artist">
            ${escapeHtml(song.artist || "Unknown Artist")}
          </div>

        </div>

        <button
          class="favorite"
          title="Favorite"
        >
          ♡
        </button>

        <button
          class="play-button"
          title="Play"
        >
          ▶
        </button>

      `;


      const playButton =
        row.querySelector(".play-button");


      playButton.addEventListener(
        "click",
        async () => {

          const { data } =
            supabaseClient
              .storage
              .from("music")
              .getPublicUrl(
                song.file_path
              );


          audio.src =
            data.publicUrl;


          nowPlaying.textContent =
            "Now playing: " +
            (song.title || "Untitled");


          try {

            await audio.play();

          } catch (error) {

            console.log(error);

          }

        }
      );


      const favorite =
        row.querySelector(".favorite");


      favorite.addEventListener(
        "click",
        () => {

          if (
            favorite.textContent === "♡"
          ) {

            favorite.textContent = "♥";

          } else {

            favorite.textContent = "♡";

          }

        }
      );


      songsContainer.appendChild(row);

    });

  }


  // =====================================
  // UPLOAD SONG
  // =====================================

  uploadButton.addEventListener(
    "click",
    async () => {

      const audioFile =
        fileInput.files[0];

      const coverFile =
        coverInput.files[0];

      const title =
        songTitle.value.trim();

      const artist =
        artistName.value.trim();


      // CHECK TITLE

      if (!title) {

        alert(
          "Please enter a song title."
        );

        return;
      }


      // CHECK ARTIST

      if (!artist) {

        alert(
          "Please enter the artist name."
        );

        return;
      }


      // CHECK AUDIO

      if (!audioFile) {

        alert(
          "Please choose a music file."
        );

        return;
      }


      if (
        !audioFile.type.startsWith("audio/")
      ) {

        alert(
          "Please choose an audio file."
        );

        return;
      }


      // CHECK COVER

      if (!coverFile) {

        alert(
          "Please choose cover artwork."
        );

        return;
      }


      if (
        !coverFile.type.startsWith("image/")
      ) {

        alert(
          "Please choose an image for the cover."
        );

        return;
      }


      uploadButton.disabled = true;

      uploadButton.textContent =
        "Uploading...";

      uploadStatus.textContent =
        "Uploading your music...";


      // =====================================
      // AUDIO FILE NAME
      // =====================================

      const audioFileName =
        Date.now() +
        "-" +
        audioFile.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      // =====================================
      // COVER FILE NAME
      // =====================================

      const coverFileName =
        Date.now() +
        "-cover-" +
        coverFile.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      // =====================================
      // UPLOAD AUDIO
      // =====================================

      const { error: audioError } =
        await supabaseClient
          .storage
          .from("music")
          .upload(
            audioFileName,
            audioFile
          );


      if (audioError) {

        alert(
          "Music upload failed: " +
          audioError.message
        );

        uploadButton.disabled = false;

        uploadButton.textContent =
          "Upload Song";

        uploadStatus.textContent = "";

        return;
      }


      uploadStatus.textContent =
        "Music uploaded. Uploading cover...";


      // =====================================
      // UPLOAD COVER
      // =====================================

      const { error: coverError } =
        await supabaseClient
          .storage
          .from("covers")
          .upload(
            coverFileName,
            coverFile
          );


      if (coverError) {

        alert(
          "Cover upload failed: " +
          coverError.message
        );

        uploadButton.disabled = false;

        uploadButton.textContent =
          "Upload Song";

        uploadStatus.textContent = "";

        return;
      }


      // =====================================
      // GET COVER URL
      // =====================================

      const { data: coverData } =
        supabaseClient
          .storage
          .from("covers")
          .getPublicUrl(
            coverFileName
          );


      const coverURL =
        coverData.publicUrl;


      // =====================================
      // SAVE SONG TO DATABASE
      // =====================================

      uploadStatus.textContent =
        "Saving song information...";


      const { error: databaseError } =
        await supabaseClient
          .from("songs")
          .insert({

            title: title,

            artist: artist,

            file_path: audioFileName,

            cover_url: coverURL

          });


      if (databaseError) {

        alert(
          "Files uploaded, but the song record failed: " +
          databaseError.message
        );

        uploadButton.disabled = false;

        uploadButton.textContent =
          "Upload Song";

        uploadStatus.textContent = "";

        return;
      }


      // =====================================
      // SUCCESS
      // =====================================

      alert(
        "🎵 Song uploaded successfully!"
      );


      songTitle.value = "";
      artistName.value = "";
      fileInput.value = "";
      coverInput.value = "";

      uploadStatus.textContent = "";

      uploadForm.classList.remove("show");


      uploadButton.disabled = false;

      uploadButton.textContent =
        "Upload Song";


      loadSongs();

    }
  );


  // =====================================
  // SEARCH
  // =====================================

  search.addEventListener(
    "input",
    () => {

      displaySongs(
        search.value
      );

    }
  );


  // =====================================
  // SECURITY
  // =====================================

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text || "";

    return div.innerHTML;

  }


  // =====================================
  // START
  // =====================================

  loadSongs();

</script>

</body>
</html>
