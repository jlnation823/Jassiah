<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding-bottom: 100px;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px;
    }

    .upload-box {
      background: #1b1b1b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    label {
      display: block;
      margin-top: 8px;
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      margin-top: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .upload-btn {
      background: #1db954;
      color: white;
    }

    .edit-btn {
      background: #3498db;
      color: white;
      margin-right: 8px;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .cancel-btn {
      background: #555;
      color: white;
      margin-left: 5px;
    }

    .song {
      background: #1b1b1b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      align-items: flex-start;
      gap: 15px;
    }

    .cover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .artist {
      color: #aaa;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
      margin-top: 5px;
    }

    .edit-form {
      display: none;
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .message {
      margin-top: 10px;
      color: #1db954;
      white-space: pre-wrap;
    }

    .error {
      color: #ff5555;
    }

    .search {
      margin-bottom: 20px;
    }

    /* Bottom player */
    #bottomPlayer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: #080808;
      border-top: 1px solid #333;
      display: none;
      align-items: center;
      gap: 15px;
      padding: 10px 20px;
      z-index: 9999;
    }

    #playerCover {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 6px;
      background: #333;
    }

    #playerInfo {
      width: 180px;
      min-width: 120px;
    }

    #playerTitle {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #playerArtist {
      color: #aaa;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #playerControls {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    #playerControls button {
      background: transparent;
      color: white;
      font-size: 22px;
      padding: 5px;
      margin: 0;
    }

    #playerProgress {
      flex: 1;
    }

    @media (max-width: 600px) {
      .song {
        flex-direction: column;
      }

      .cover {
        width: 90px;
        height: 90px;
      }

      #bottomPlayer {
        height: 80px;
        padding: 8px;
      }

      #playerCover {
        width: 55px;
        height: 55px;
      }

      #playerInfo {
        width: 120px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
</header>

<div class="container">

  <!-- UPLOAD -->
  <div class="upload-box">
    <h2>Add New Song</h2>

    <input
      type="text"
      id="songTitle"
      placeholder="Song title"
    >

    <input
      type="text"
      id="artist"
      placeholder="Artist"
    >

    <label>Music file:</label>
    <input
      type="file"
      id="musicFile"
      accept="audio/*"
    >

    <label>Cover image:</label>
    <input
      type="file"
      id="coverFile"
      accept="image/*"
    >

    <button
      id="uploadButton"
      class="upload-btn"
      onclick="uploadSong()"
    >
      Upload Song
    </button>

    <div id="uploadMessage" class="message"></div>
  </div>

  <input
    class="search"
    type="text"
    id="searchInput"
    placeholder="🔎 Search songs or artists..."
    oninput="filterSongs()"
  >

  <h2>Your Songs</h2>

  <div id="songs">
    Loading songs...
  </div>

</div>

<!-- BOTTOM PLAYER -->
<div id="bottomPlayer">

  <img
    id="playerCover"
    src=""
    alt="Cover"
  >

  <div id="playerInfo">
    <div id="playerTitle">No song playing</div>
    <div id="playerArtist"></div>
  </div>

  <div id="playerControls">

    <button onclick="previousSong()">⏮</button>

    <button onclick="togglePlayer()">▶️</button>

    <button onclick="nextSong()">⏭</button>

    <input
      id="playerProgress"
      type="range"
      min="0"
      max="100"
      value="0"
      oninput="seekPlayer(this.value)"
    >

  </div>

</div>

<script>

  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     GLOBAL VARIABLES
     ========================================================= */

  let allSongs = [];

  let currentSongIndex = -1;

  let playerAudio = new Audio();


  /* =========================================================
     GET PUBLIC MUSIC URL
     ========================================================= */

  function getMusicUrl(song) {

    /*
      Your database uses file_path.

      If file_path is already a complete URL,
      use it directly.

      Otherwise get the public URL from the
      "music" Supabase storage bucket.
    */

    if (!song.file_path) {
      return "";
    }

    if (
      song.file_path.startsWith("http://") ||
      song.file_path.startsWith("https://")
    ) {
      return song.file_path;
    }

    const result =
      supabaseClient.storage
        .from("music")
        .getPublicUrl(song.file_path);

    return result.data.publicUrl;
  }


  /* =========================================================
     GET COVER URL
     ========================================================= */

  function getCoverUrl(song) {

    if (!song.cover_url) {
      return "";
    }

    return song.cover_url;
  }


  /* =========================================================
     LOAD SONGS
     ========================================================= */

  async function loadSongs() {

    const songsContainer =
      document.getElementById("songs");

    songsContainer.innerHTML =
      "Loading songs...";

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("id", {
          ascending: false
        });

    if (error) {

      console.error(error);

      songsContainer.innerHTML =
        `<p class="error">
          Could not load songs:
          ${escapeHtml(error.message)}
        </p>`;

      return;
    }

    allSongs = data || [];

    displaySongs(allSongs);
  }


  /* =========================================================
     DISPLAY SONGS
     ========================================================= */

  function displaySongs(songs) {

    const songsContainer =
      document.getElementById("songs");

    songsContainer.innerHTML = "";

    if (!songs || songs.length === 0) {

      songsContainer.innerHTML =
        "<p>No songs uploaded yet.</p>";

      return;
    }

    songs.forEach((song) => {

      const div =
        document.createElement("div");

      div.className = "song";

      const musicUrl =
        getMusicUrl(song);

      const coverUrl =
        getCoverUrl(song);

      const coverHTML =
        coverUrl
          ? `
            <img
              class="cover"
              src="${escapeAttribute(coverUrl)}"
              alt="Cover"
              onerror="this.style.display='none';"
            >
          `
          : `
            <div
              class="cover"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:35px;
              "
            >
              🎵
            </div>
          `;

      div.innerHTML = `

        ${coverHTML}

        <div class="song-info">

          <div class="song-title">
            ${escapeHtml(song.title || "Untitled")}
          </div>

          <div class="artist">
            ${escapeHtml(song.artist || "Unknown Artist")}
          </div>

          ${
            musicUrl
              ? `
                <audio
                  controls
                  preload="metadata"
                  data-song-id="${song.id}"
                  src="${escapeAttribute(musicUrl)}"
                ></audio>
              `
              : `
                <p class="error">
                  Music file is missing.
                </p>
              `
          }

          <div>

            <button
              class="edit-btn"
              onclick="showEditForm(${song.id})"
            >
              ✏️ Edit
            </button>

            <button
              class="delete-btn"
              onclick="deleteSong(${song.id})"
            >
              🗑️ Delete
            </button>

          </div>

          <div
            id="edit-${song.id}"
            class="edit-form"
          >

            <input
              id="title-${song.id}"
              type="text"
              value="${escapeAttribute(song.title || "")}"
              placeholder="Song title"
            >

            <input
              id="artist-${song.id}"
              type="text"
              value="${escapeAttribute(song.artist || "")}"
              placeholder="Artist"
            >

            <label>
              New cover image:
            </label>

            <input
              id="cover-${song.id}"
              type="file"
              accept="image/*"
            >

            <button
              class="upload-btn"
              onclick="saveEdit(${song.id})"
            >
              💾 Save Changes
            </button>

            <button
              class="cancel-btn"
              onclick="hideEditForm(${song.id})"
            >
              Cancel
            </button>

          </div>

        </div>
      `;

      songsContainer.appendChild(div);

      const audio =
        div.querySelector("audio");

      if (audio) {

        audio.addEventListener(
          "play",
          function() {

            const index =
              allSongs.findIndex(
                s => s.id === song.id
              );

            currentSongIndex = index;

            playBottomPlayer(song);

            /*
              Pause all other song players.
            */

            document
              .querySelectorAll("audio")
              .forEach(otherAudio => {

                if (
                  otherAudio !== audio
                ) {
                  otherAudio.pause();
                }

              });

          }
        );

        audio.addEventListener(
          "error",
          function() {

            console.error(
              "Could not play:",
              musicUrl
            );

          }
        );
      }

    });

  }


  /* =========================================================
     SEARCH
     ========================================================= */

  function filterSongs() {

    const search =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    if (!search) {

      displaySongs(allSongs);

      return;
    }

    const filtered =
      allSongs.filter(song => {

        const title =
          (song.title || "")
            .toLowerCase();

        const artist =
          (song.artist || "")
            .toLowerCase();

        return (
          title.includes(search) ||
          artist.includes(search)
        );

      });

    displaySongs(filtered);
  }


  /* =========================================================
     SHOW EDIT
     ========================================================= */

  function showEditForm(id) {

    const form =
      document.getElementById(
        `edit-${id}`
      );

    if (form) {

      form.style.display = "block";

    }
  }


  /* =========================================================
     HIDE EDIT
     ========================================================= */

  function hideEditForm(id) {

    const form =
      document.getElementById(
        `edit-${id}`
      );

    if (form) {

      form.style.display = "none";

    }
  }


  /* =========================================================
     SAVE EDIT
     ========================================================= */

  async function saveEdit(id) {

    const title =
      document
        .getElementById(`title-${id}`)
        .value
        .trim();

    const artist =
      document
        .getElementById(`artist-${id}`)
        .value
        .trim();

    const coverInput =
      document.getElementById(
        `cover-${id}`
      );

    if (!title) {

      alert("Please enter a song title.");

      return;
    }

    if (!artist) {

      alert("Please enter an artist.");

      return;
    }

    const updateData = {
      title: title,
      artist: artist
    };


    /* NEW COVER */

    if (
      coverInput &&
      coverInput.files.length > 0
    ) {

      const file =
        coverInput.files[0];

      const safeName =
        file.name
          .replace(/\s+/g, "_")
          .replace(/[^a-zA-Z0-9._-]/g, "");

      const fileName =
        "covers/" +
        Date.now() +
        "_" +
        safeName;

      const { error: uploadError } =
        await supabaseClient.storage
          .from("music")
          .upload(
            fileName,
            file,
            {
              upsert: false
            }
          );

      if (uploadError) {

        alert(
          "Cover upload failed:\n" +
          uploadError.message
        );

        return;
      }

      const { data: publicData } =
        supabaseClient.storage
          .from("music")
          .getPublicUrl(fileName);

      updateData.cover_url =
        publicData.publicUrl;
    }


    /* UPDATE DATABASE */

    const { error } =
      await supabaseClient
        .from("songs")
        .update(updateData)
        .eq("id", id);

    if (error) {

      alert(
        "Could not save changes:\n" +
        error.message
      );

      return;
    }

    alert(
      "Song updated successfully! 🎉"
    );

    await loadSongs();
  }


  /* =========================================================
     UPLOAD NEW SONG
     ========================================================= */

  async function uploadSong() {

    const title =
      document
        .getElementById("songTitle")
        .value
        .trim();

    const artist =
      document
        .getElementById("artist")
        .value
        .trim();

    const musicInput =
      document.getElementById(
        "musicFile"
      );

    const coverInput =
      document.getElementById(
        "coverFile"
      );

    const message =
      document.getElementById(
        "uploadMessage"
      );

    const button =
      document.getElementById(
        "uploadButton"
      );


    /* CHECK INPUT */

    if (!title) {

      message.innerText =
        "Please enter the song title.";

      return;
    }

    if (!artist) {

      message.innerText =
        "Please enter the artist.";

      return;
    }

    if (
      !musicInput.files ||
      musicInput.files.length === 0
    ) {

      message.innerText =
        "Please choose a music file.";

      return;
    }


    button.disabled = true;

    message.className =
      "message";

    message.innerText =
      "Uploading song...";


    try {

      const musicFile =
        musicInput.files[0];

      const safeMusicName =
        musicFile.name
          .replace(/\s+/g, "_")
          .replace(/[^a-zA-Z0-9._-]/g, "");

      const musicPath =
        Date.now() +
        "_" +
        safeMusicName;


      /* UPLOAD MUSIC */

      const { error: musicError } =
        await supabaseClient.storage
          .from("music")
          .upload(
            musicPath,
            musicFile,
            {
              upsert: false
            }
          );

      if (musicError) {

        throw new Error(
          "Music upload failed: " +
          musicError.message
        );
      }


      /* GET MUSIC URL */

      const { data: musicPublic } =
        supabaseClient.storage
          .from("music")
          .getPublicUrl(
            musicPath
          );

      const musicUrl =
        musicPublic.publicUrl;


      /* COVER */

      let coverUrl = null;

      if (
        coverInput.files &&
        coverInput.files.length > 0
      ) {

        const coverFile =
          coverInput.files[0];

        const safeCoverName =
          coverFile.name
            .replace(/\s+/g, "_")
            .replace(/[^a-zA-Z0-9._-]/g, "");

        const coverPath =
          "covers/" +
          Date.now() +
          "_" +
          safeCoverName;


        const { error: coverError } =
          await supabaseClient.storage
            .from("music")
            .upload(
              coverPath,
              coverFile,
              {
                upsert: false
              }
            );

        if (coverError) {

          throw new Error(
            "Cover upload failed: " +
            coverError.message
          );
        }


        const { data: coverPublic } =
          supabaseClient.storage
            .from("music")
            .getPublicUrl(
              coverPath
            );

        coverUrl =
          coverPublic.publicUrl;
      }


      /* SAVE TO SONGS TABLE */

      const { error: databaseError } =
        await supabaseClient
          .from("songs")
          .insert([
            {
              title: title,
              artist: artist,

              /*
                IMPORTANT:
                Your table uses file_path,
                NOT music_url.
              */

              file_path: musicPath,

              cover_url: coverUrl
            }
          ]);


      if (databaseError) {

        throw new Error(
          "Database error: " +
          databaseError.message
        );
      }


      message.innerText =
        "Song uploaded successfully! 🎉";


      /* CLEAR FORM */

      document
        .getElementById("songTitle")
        .value = "";

      document
        .getElementById("artist")
        .value = "";

      musicInput.value = "";

      coverInput.value = "";


      await loadSongs();

    }

    catch (error) {

      console.error(error);

      message.className =
        "message error";

      message.innerText =
        error.message;
    }

    finally {

      button.disabled = false;

    }

  }


  /* =========================================================
     DELETE SONG
     ========================================================= */

  async function deleteSong(id) {

    const song =
      allSongs.find(
        s => s.id === id
      );

    if (!song) {

      alert("Song not found.");

      return;
    }


    const confirmed =
      confirm(
        `Are you sure you want to delete "${song.title}"?`
      );

    if (!confirmed) {

      return;
    }


    /* DELETE DATABASE RECORD */

    const { error } =
      await supabaseClient
        .from("songs")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Could not delete song:\n" +
        error.message
      );

      return;
    }


    await loadSongs();

  }


  /* =========================================================
     BOTTOM PLAYER
     ========================================================= */

  function playBottomPlayer(song) {

    const player =
      document.getElementById(
        "bottomPlayer"
      );

    const cover =
      document.getElementById(
        "playerCover"
      );

    const title =
      document.getElementById(
        "playerTitle"
      );

    const artist =
      document.getElementById(
        "playerArtist"
      );


    player.style.display =
      "flex";

    title.innerText =
      song.title || "Untitled";

    artist.innerText =
      song.artist || "Unknown Artist";


    if (song.cover_url) {

      cover.src =
        song.cover_url;

    }

  }


  /* =========================================================
     BOTTOM PLAYER TOGGLE
     ========================================================= */

  function togglePlayer() {

    if (
      !playerAudio.src
    ) {

      if (
        currentSongIndex >= 0
      ) {

        startBottomSong(
          currentSongIndex
        );

      }

      return;
    }


    if (playerAudio.paused) {

      playerAudio.play();

    } else {

      playerAudio.pause();

    }

  }


  /* =========================================================
     START BOTTOM SONG
     ========================================================= */

  function startBottomSong(index) {

    if (
      index < 0 ||
      index >= allSongs.length
    ) {

      return;
    }

    const song =
      allSongs[index];

    const url =
      getMusicUrl(song);

    if (!url) {

      alert(
        "This song does not have a valid music file."
      );

      return;
    }

    currentSongIndex =
      index;

    playerAudio.src =
      url;

    playBottomPlayer(song);

    playerAudio.play()
      .catch(error => {

        console.error(
          "Playback error:",
          error
        );

      });

  }


  /* =========================================================
     NEXT SONG
     ========================================================= */

  function nextSong() {

    if (
      allSongs.length === 0
    ) {

      return;
    }

    let next =
      currentSongIndex + 1;

    if (
      next >= allSongs.length
    ) {

      next = 0;

    }

    startBottomSong(next);

  }


  /* =========================================================
     PREVIOUS SONG
     ========================================================= */

  function previousSong() {

    if (
      allSongs.length === 0
    ) {

      return;
    }

    let previous =
      currentSongIndex - 1;

    if (
      previous < 0
    ) {

      previous =
        allSongs.length - 1;

    }

    startBottomSong(previous);

  }


  /* =========================================================
     SEEK
     ========================================================= */

  function seekPlayer(value) {

    if (
      playerAudio.duration
    ) {

      playerAudio.currentTime =
        (
          value / 100
        ) *
        playerAudio.duration;

    }

  }


  /* =========================================================
     PLAYER EVENTS
     ========================================================= */

  playerAudio.addEventListener(
    "timeupdate",
    function() {

      if (
        playerAudio.duration
      ) {

        const percent =
          (
            playerAudio.currentTime /
            playerAudio.duration
          ) * 100;

        document
          .getElementById(
            "playerProgress"
          )
          .value = percent;

      }

    }
  );


  playerAudio.addEventListener(
    "ended",
    function() {

      nextSong();

    }
  );


  /* =========================================================
     PROTECT HTML
     ========================================================= */

  function escapeHtml(text) {

    return String(text)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(text) {

    return escapeHtml(text);

  }


  /* =========================================================
     START WEBSITE
     ========================================================= */

  loadSongs();

</script>

</body>
</html>
