<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding-bottom: 125px;
    }

    header {
      background: #000;
      padding: 25px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px;
    }

    .upload-box {
      background: #1b1b1b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: #888;
    }

    label {
      display: block;
      margin-top: 8px;
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      margin-top: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    .upload-btn {
      background: #1db954;
      color: white;
    }

    .edit-btn {
      background: #3498db;
      color: white;
      margin-right: 8px;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .cancel-btn {
      background: #555;
      color: white;
    }

    /* SEARCH */

    #searchBox {
      margin-bottom: 25px;
      font-size: 16px;
    }

    /* SONG CARD */

    .song {
      background: #1b1b1b;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .cover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .artist {
      color: #aaa;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
      margin-top: 5px;
    }

    .edit-form {
      display: none;
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .message {
      margin-top: 10px;
      color: #1db954;
    }

    /* =========================
       BIG BOTTOM MUSIC PLAYER
       ========================= */

    #musicPlayer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 115px;
      background: #181818;
      border-top: 1px solid #333;
      z-index: 9999;
      box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.65);

      display: flex;
      align-items: center;
      padding: 12px 25px;
      gap: 20px;
    }

    #playerCover {
      width: 82px;
      height: 82px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }

    #playerInfo {
      width: 220px;
      min-width: 160px;
      overflow: hidden;
    }

    #playerTitle {
      font-size: 18px;
      font-weight: bold;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #playerArtist {
      font-size: 14px;
      color: #aaa;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #playerCenter {
      flex: 1;
      min-width: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #playerControls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #playerControls button {
      background: transparent;
      color: white;
      border: none;
      padding: 5px;
      margin: 0;
      font-size: 20px;
      cursor: pointer;
    }

    #playerControls button:hover {
      transform: scale(1.15);
    }

    #playPauseBtn {
      width: 52px;
      height: 52px;
      border-radius: 50% !important;
      background: white !important;
      color: black !important;
      font-size: 24px !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #playerProgressArea {
      width: 100%;
      max-width: 650px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    #currentTime,
    #duration {
      color: #aaa;
      font-size: 12px;
      min-width: 38px;
      text-align: center;
    }

    #progressBar {
      flex: 1;
      height: 5px;
      cursor: pointer;
      accent-color: #1db954;
    }

    #volumeArea {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 145px;
    }

    #volumeArea span {
      font-size: 20px;
    }

    #volumeBar {
      width: 100px;
      cursor: pointer;
      accent-color: #1db954;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      body {
        padding-bottom: 105px;
      }

      header h1 {
        font-size: 26px;
      }

      .container {
        padding: 15px;
      }

      .song {
        align-items: flex-start;
      }

      .cover {
        width: 70px;
        height: 70px;
      }

      .song-title {
        font-size: 17px;
      }

      #musicPlayer {
        height: 100px;
        padding: 8px 10px;
        gap: 10px;
      }

      #playerCover {
        width: 65px;
        height: 65px;
      }

      #playerInfo {
        width: 115px;
        min-width: 90px;
      }

      #playerTitle {
        font-size: 14px;
      }

      #playerArtist {
        font-size: 11px;
      }

      #playerCenter {
        min-width: 0;
      }

      #playerControls {
        gap: 5px;
      }

      #playerControls button {
        font-size: 16px;
      }

      #playPauseBtn {
        width: 42px;
        height: 42px;
        font-size: 20px !important;
      }

      #volumeArea {
        display: none;
      }

      #playerProgressArea {
        gap: 4px;
      }

      #currentTime,
      #duration {
        font-size: 10px;
        min-width: 30px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
</header>

<div class="container">

  <!-- UPLOAD -->

  <div class="upload-box">

    <h2>Add New Song</h2>

    <input
      type="text"
      id="songTitle"
      placeholder="Song title"
    >

    <input
      type="text"
      id="artist"
      placeholder="Artist"
    >

    <label>Music file:</label>

    <input
      type="file"
      id="musicFile"
      accept="audio/*"
    >

    <label>Cover image:</label>

    <input
      type="file"
      id="coverFile"
      accept="image/*"
    >

    <button
      class="upload-btn"
      onclick="uploadSong()"
    >
      Upload Song
    </button>

    <div
      id="uploadMessage"
      class="message"
    ></div>

  </div>

  <!-- SEARCH -->

  <input
    type="text"
    id="searchBox"
    placeholder="🔎 Search songs or artists..."
    oninput="searchSongs()"
  >

  <h2>Your Songs</h2>

  <div id="songs"></div>

</div>


<!-- =========================
     BIG MUSIC PLAYER
     ========================= -->

<div id="musicPlayer">

  <img
    id="playerCover"
    src="https://via.placeholder.com/90?text=Music"
    alt="Album Cover"
  >

  <div id="playerInfo">

    <div id="playerTitle">
      Select a song
    </div>

    <div id="playerArtist">
      No song playing
    </div>

  </div>


  <div id="playerCenter">

    <div id="playerControls">

      <button
        id="shuffleBtn"
        onclick="toggleShuffle()"
        title="Shuffle"
      >
        🔀
      </button>

      <button
        onclick="previousSong()"
        title="Previous"
      >
        ⏮
      </button>

      <button
        id="playPauseBtn"
        onclick="togglePlay()"
        title="Play/Pause"
      >
        ▶
      </button>

      <button
        onclick="nextSong()"
        title="Next"
      >
        ⏭
      </button>

      <button
        id="repeatBtn"
        onclick="toggleRepeat()"
        title="Repeat"
      >
        🔁
      </button>

    </div>


    <div id="playerProgressArea">

      <span id="currentTime">
        0:00
      </span>

      <input
        id="progressBar"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        oninput="seekSong()"
      >

      <span id="duration">
        0:00
      </span>

    </div>

  </div>


  <div id="volumeArea">

    <span>🔊</span>

    <input
      id="volumeBar"
      type="range"
      min="0"
      max="1"
      value="1"
      step="0.01"
      oninput="changeVolume()"
    >

  </div>

</div>


<script>

  /* =========================
     SUPABASE
     ========================= */

  const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     MUSIC PLAYER VARIABLES
     ========================= */

  let allSongs = [];

  let currentSongIndex = -1;

  let currentAudio = null;

  let shuffle = false;

  let repeat = false;


  const playerCover =
    document.getElementById("playerCover");

  const playerTitle =
    document.getElementById("playerTitle");

  const playerArtist =
    document.getElementById("playerArtist");

  const playPauseBtn =
    document.getElementById("playPauseBtn");

  const progressBar =
    document.getElementById("progressBar");

  const currentTime =
    document.getElementById("currentTime");

  const duration =
    document.getElementById("duration");

  const volumeBar =
    document.getElementById("volumeBar");


  /* =========================
     LOAD SONGS
     ========================= */

  async function loadSongs() {

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("id", {
          ascending: false
        });

    if (error) {

      console.error(error);

      document.getElementById("songs").innerHTML =
        "<p>Could not load songs.</p>";

      return;
    }

    allSongs = data || [];

    displaySongs(allSongs);
  }


  /* =========================
     DISPLAY SONGS
     ========================= */

  function displaySongs(songs) {

    const songsContainer =
      document.getElementById("songs");

    songsContainer.innerHTML = "";

    if (!songs || songs.length === 0) {

      songsContainer.innerHTML =
        "<p>No songs uploaded yet.</p>";

      return;
    }


    songs.forEach((song, index) => {

      const div =
        document.createElement("div");

      div.className = "song";

      div.dataset.songId = song.id;


      const cover =
        song.cover_url ||
        "https://via.placeholder.com/90?text=Music";


      div.innerHTML = `

        <img
          class="cover"
          src="${cover}"
          alt="Cover"
        >

        <div class="song-info">

          <div class="song-title">
            ${escapeHtml(
              song.title || "Untitled"
            )}
          </div>

          <div class="artist">
            ${escapeHtml(
              song.artist || "Unknown Artist"
            )}
          </div>

          <audio
            controls
            src="${song.music_url}"
            data-index="${index}"
          ></audio>

          <div>

            <button
              class="edit-btn"
              onclick="showEditForm(${song.id})"
            >
              ✏️ Edit
            </button>

            <button
              class="delete-btn"
              onclick="deleteSong(${song.id})"
            >
              🗑️ Delete
            </button>

          </div>


          <div
            id="edit-${song.id}"
            class="edit-form"
          >

            <input
              id="title-${song.id}"
              type="text"
              value="${escapeAttribute(
                song.title || ""
              )}"
              placeholder="Song title"
            >

            <input
              id="artist-${song.id}"
              type="text"
              value="${escapeAttribute(
                song.artist || ""
              )}"
              placeholder="Artist"
            >

            <label>
              New cover image:
            </label>

            <input
              id="cover-${song.id}"
              type="file"
              accept="image/*"
            >

            <button
              class="upload-btn"
              onclick="saveEdit(${song.id})"
            >
              💾 Save Changes
            </button>

            <button
              class="cancel-btn"
              onclick="hideEditForm(${song.id})"
            >
              Cancel
            </button>

          </div>

        </div>
      `;


      songsContainer.appendChild(div);


      const audio =
        div.querySelector("audio");


      audio.addEventListener(
        "play",
        function() {

          startPlayer(
            song,
            index,
            audio
          );

        }
      );

    });

  }


  /* =========================
     START BOTTOM PLAYER
     ========================= */

  function startPlayer(
    song,
    index,
    audio
  ) {

    if (
      currentAudio &&
      currentAudio !== audio
    ) {

      currentAudio.pause();

    }


    currentAudio = audio;

    currentSongIndex = index;


    playerTitle.textContent =
      song.title || "Untitled";

    playerArtist.textContent =
      song.artist || "Unknown Artist";

    playerCover.src =
      song.cover_url ||
      "https://via.placeholder.com/90?text=Music";


    currentAudio.addEventListener(
      "timeupdate",
      updateProgress
    );

    currentAudio.addEventListener(
      "loadedmetadata",
      updateDuration
    );

    currentAudio.addEventListener(
      "ended",
      songEnded
    );


    playPauseBtn.textContent = "⏸";

  }


  /* =========================
     PLAY / PAUSE
     ========================= */

  function togglePlay() {

    if (!currentAudio) {

      if (allSongs.length > 0) {

        playSong(0);

      }

      return;
    }


    if (currentAudio.paused) {

      currentAudio.play();

      playPauseBtn.textContent = "⏸";

    } else {

      currentAudio.pause();

      playPauseBtn.textContent = "▶";

    }

  }


  /* =========================
     PLAY SONG
     ========================= */

  function playSong(index) {

    if (
      index < 0 ||
      index >= allSongs.length
    ) {
      return;
    }


    const song =
      allSongs[index];


    const songCards =
      document.querySelectorAll(
        ".song"
      );


    const card =
      Array.from(songCards)
        .find(
          element =>
            Number(
              element.dataset.songId
            ) === Number(song.id)
        );


    if (!card) {

      displaySongs(allSongs);

      setTimeout(
        () => playSong(index),
        100
      );

      return;
    }


    const audio =
      card.querySelector("audio");


    if (!audio) {
      return;
    }


    if (
      currentAudio &&
      currentAudio !== audio
    ) {

      currentAudio.pause();

      currentAudio.currentTime = 0;

    }


    currentAudio = audio;

    currentSongIndex = index;


    playerTitle.textContent =
      song.title || "Untitled";

    playerArtist.textContent =
      song.artist || "Unknown Artist";

    playerCover.src =
      song.cover_url ||
      "https://via.placeholder.com/90?text=Music";


    audio.play();

    playPauseBtn.textContent = "⏸";

  }


  /* =========================
     PREVIOUS SONG
     ========================= */

  function previousSong() {

    if (allSongs.length === 0) {
      return;
    }


    let index =
      currentSongIndex - 1;


    if (index < 0) {

      index =
        allSongs.length - 1;

    }


    playSong(index);

  }


  /* =========================
     NEXT SONG
     ========================= */

  function nextSong() {

    if (allSongs.length === 0) {
      return;
    }


    let index;


    if (shuffle) {

      index =
        Math.floor(
          Math.random() *
          allSongs.length
        );

    } else {

      index =
        currentSongIndex + 1;


      if (
        index >= allSongs.length
      ) {

        index = 0;

      }

    }


    playSong(index);

  }


  /* =========================
     SONG ENDED
     ========================= */

  function songEnded() {

    if (repeat) {

      currentAudio.currentTime = 0;

      currentAudio.play();

      return;

    }


    nextSong();

  }


  /* =========================
     SHUFFLE
     ========================= */

  function toggleShuffle() {

    shuffle = !shuffle;


    const button =
      document.getElementById(
        "shuffleBtn"
      );


    button.style.opacity =
      shuffle ? "1" : "0.5";

  }


  /* =========================
     REPEAT
     ========================= */

  function toggleRepeat() {

    repeat = !repeat;


    const button =
      document.getElementById(
        "repeatBtn"
      );


    button.style.opacity =
      repeat ? "1" : "0.5";

  }


  /* =========================
     PROGRESS
     ========================= */

  function updateProgress() {

    if (!currentAudio) {
      return;
    }


    if (
      currentAudio.duration &&
      !isNaN(currentAudio.duration)
    ) {

      progressBar.value =
        (
          currentAudio.currentTime /
          currentAudio.duration
        ) * 100;

    }


    currentTime.textContent =
      formatTime(
        currentAudio.currentTime
      );

  }


  function updateDuration() {

    if (!currentAudio) {
      return;
    }


    duration.textContent =
      formatTime(
        currentAudio.duration
      );

  }


  /* =========================
     SEEK
     ========================= */

  function seekSong() {

    if (!currentAudio) {
      return;
    }


    if (
      !currentAudio.duration ||
      isNaN(currentAudio.duration)
    ) {
      return;
    }


    currentAudio.currentTime =
      (
        progressBar.value / 100
      ) *
      currentAudio.duration;

  }


  /* =========================
     VOLUME
     ========================= */

  function changeVolume() {

    if (!currentAudio) {
      return;
    }


    currentAudio.volume =
      volumeBar.value;

  }


  /* =========================
     TIME FORMAT
     ========================= */

  function formatTime(seconds) {

    if (
      !seconds ||
      isNaN(seconds)
    ) {
      return "0:00";
    }


    const minutes =
      Math.floor(
        seconds / 60
      );


    const secs =
      Math.floor(
        seconds % 60
      );


    return (
      minutes +
      ":" +
      String(secs).padStart(2, "0")
    );

  }


  /* =========================
     SEARCH
     ========================= */

  function searchSongs() {

    const search =
      document
        .getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();


    if (!search) {

      displaySongs(allSongs);

      return;

    }


    const filtered =
      allSongs.filter(song => {

        const title =
          (
            song.title || ""
          ).toLowerCase();

        const artist =
          (
            song.artist || ""
          ).toLowerCase();


        return (
          title.includes(search) ||
          artist.includes(search)
        );

      });


    displaySongs(filtered);

  }


  /* =========================
     SHOW EDIT
     ========================= */

  function showEditForm(id) {

    const form =
      document.getElementById(
        `edit-${id}`
      );


    if (form) {

      form.style.display =
        "block";

    }

  }


  /* =========================
     HIDE EDIT
     ========================= */

  function hideEditForm(id) {

    const form =
      document.getElementById(
        `edit-${id}`
      );


    if (form) {

      form.style.display =
        "none";

    }

  }


  /* =========================
     SAVE EDIT
     ========================= */

  async function saveEdit(id) {

    const title =
      document.getElementById(
        `title-${id}`
      ).value;

    const artist =
      document.getElementById(
        `artist-${id}`
      ).value;

    const coverInput =
      document.getElementById(
        `cover-${id}`
      );


    let updateData = {

      title: title,

      artist: artist

    };


    if (
      coverInput.files.length > 0
    ) {

      const file =
        coverInput.files[0];


      const fileName =
        "covers/" +
        Date.now() +
        "_" +
        file.name.replace(
          /\s+/g,
          "_"
        );


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("music")
          .upload(
            fileName,
            file,
            {
              upsert: true
            }
          );


      if (uploadError) {

        alert(
          "Cover upload failed: " +
          uploadError.message
        );

        return;

      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("music")
          .getPublicUrl(
            fileName
          );


      updateData.cover_url =
        publicData.publicUrl;

    }


    const { error } =
      await supabaseClient
        .from("songs")
        .update(updateData)
        .eq("id", id);


    if (error) {

      alert(
        "Could not save changes: " +
        error.message
      );

      return;

    }


    alert(
      "Song updated successfully! 🎉"
    );


    loadSongs();

  }


  /* =========================
     UPLOAD NEW SONG
     ========================= */

  async function uploadSong() {

    const title =
      document.getElementById(
        "songTitle"
      ).value.trim();


    const artist =
      document.getElementById(
        "artist"
      ).value.trim();


    const musicInput =
      document.getElementById(
        "musicFile"
      );


    const coverInput =
      document.getElementById(
        "coverFile"
      );


    const message =
      document.getElementById(
        "uploadMessage"
      );


    if (
      !title ||
      !artist ||
      musicInput.files.length === 0
    ) {

      message.innerText =
        "Please enter the title, artist, and music file.";

      return;

    }


    message.innerText =
      "Uploading...";


    const musicFile =
      musicInput.files[0];


    /* MUSIC */

    const musicName =
      "songs/" +
      Date.now() +
      "_" +
      musicFile.name.replace(
        /\s+/g,
        "_"
      );


    const {
      error: musicError
    } =
      await supabaseClient
        .storage
        .from("music")
        .upload(
          musicName,
          musicFile
        );


    if (musicError) {

      message.innerText =
        "Music upload failed: " +
        musicError.message;

      return;

    }


    const {
      data: musicPublic
    } =
      supabaseClient
        .storage
        .from("music")
        .getPublicUrl(
          musicName
        );


    let coverUrl = "";


    /* COVER */

    if (
      coverInput.files.length > 0
    ) {

      const coverFile =
        coverInput.files[0];


      const coverName =
        "covers/" +
        Date.now() +
        "_" +
        coverFile.name.replace(
          /\s+/g,
          "_"
        );


      const {
        error: coverError
      } =
        await supabaseClient
          .storage
          .from("music")
          .upload(
            coverName,
            coverFile
          );


      if (coverError) {

        message.innerText =
          "Cover upload failed: " +
          coverError.message;

        return;

      }


      const {
        data: coverPublic
      } =
        supabaseClient
          .storage
          .from("music")
          .getPublicUrl(
            coverName
          );


      coverUrl =
        coverPublic.publicUrl;

    }


    /* DATABASE */

    const {
      error: databaseError
    } =
      await supabaseClient
        .from("songs")
        .insert([
          {
            title: title,
            artist: artist,
            music_url:
              musicPublic.publicUrl,
            cover_url:
              coverUrl
          }
        ]);


    if (databaseError) {

      message.innerText =
        "Database error: " +
        databaseError.message;

      return;

    }


    message.innerText =
      "Song uploaded successfully! 🎉";


    document.getElementById(
      "songTitle"
    ).value = "";

    document.getElementById(
      "artist"
    ).value = "";

    document.getElementById(
      "musicFile"
    ).value = "";

    document.getElementById(
      "coverFile"
    ).value = "";


    loadSongs();

  }


  /* =========================
     DELETE SONG
     ========================= */

  async function deleteSong(id) {

    if (
      !confirm(
        "Are you sure you want to delete this song?"
      )
    ) {

      return;

    }


    const { error } =
      await supabaseClient
        .from("songs")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Could not delete song: " +
        error.message
      );

      return;

    }


    loadSongs();

  }


  /* =========================
     PROTECT HTML
     ========================= */

  function escapeHtml(text) {

    return String(text)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(text) {

    return escapeHtml(text);

  }


  /* =========================
     START WEBSITE
     ========================= */

  loadSongs();

</script>

</body>
</html>
