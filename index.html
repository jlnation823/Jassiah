<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 25px;
      background: #181818;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px 120px;
    }

    .hero {
      padding: 30px;
      border-radius: 18px;
      background: #222;
      margin-bottom: 25px;
    }

    button, .upload {
      background: white;
      color: black;
      border: 0;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    input[type="file"] {
      display: none;
    }

    .search {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 0;
      background: #222;
      color: white;
      font-size: 16px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #1d1d1d;
      padding: 15px;
      margin-bottom: 8px;
      border-radius: 10px;
    }

    .song-name {
      flex: 1;
    }

    audio {
      width: 100%;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      padding: 15px;
    }

    .message {
      color: #aaa;
      padding: 30px 0;
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
  <p>Your personal music streaming library</p>
</header>

<div class="container">

  <div class="hero">
    <h2>Listen to music your way.</h2>
    <p>Upload your music and stream it from your website.</p>

    <label class="upload">
      + Add Music
      <input type="file" id="fileInput" accept="audio/*">
    </label>
  </div>

  <input
    id="search"
    class="search"
    placeholder="🔎 Search your music..."
  >

  <div id="songs">
    <div class="message">Loading your music...</div>
  </div>

</div>

<div class="player">
  <div id="nowPlaying">Nothing playing</div>
  <br>
  <audio id="audio" controls></audio>
</div>

<script>

  // =====================================
  // SUPABASE CONNECTION
  // =====================================

  const SUPABASE_URL = "https://axkdbcyvuezawgbqjtyq.supabase.co";

  const SUPABASE_KEY = "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================
  // ELEMENTS
  // =====================================

  const fileInput = document.getElementById("fileInput");
  const songsContainer = document.getElementById("songs");
  const audio = document.getElementById("audio");
  const nowPlaying = document.getElementById("nowPlaying");
  const search = document.getElementById("search");

  let songs = [];


  // =====================================
  // LOAD MUSIC
  // =====================================

  async function loadSongs() {

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {

      songsContainer.innerHTML =
        `<div class="message">
          Could not load music: ${error.message}
        </div>`;

      return;
    }

    songs = data || [];

    displaySongs();

  }


  // =====================================
  // DISPLAY SONGS
  // =====================================

  function displaySongs(filter = "") {

    songsContainer.innerHTML = "";

    const filteredSongs =
      songs.filter(song =>
        song.title
          .toLowerCase()
          .includes(filter.toLowerCase())
      );

    if (filteredSongs.length === 0) {

      songsContainer.innerHTML =
        `<div class="message">
          No music uploaded yet.
        </div>`;

      return;
    }

    filteredSongs.forEach(song => {

      const row =
        document.createElement("div");

      row.className = "song";

      row.innerHTML = `
        <button>▶</button>
        <div class="song-name">
          ${escapeHtml(song.title)}
        </div>
      `;

      row.querySelector("button")
        .addEventListener("click", () => {

          const { data } =
            supabaseClient
              .storage
              .from("music")
              .getPublicUrl(song.file_path);

          audio.src = data.publicUrl;

          audio.play();

          nowPlaying.textContent =
            "Now playing: " + song.title;

        });

      songsContainer.appendChild(row);

    });

  }


  // =====================================
  // UPLOAD MUSIC
  // =====================================

  fileInput.addEventListener("change", async () => {

    const file = fileInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("audio/")) {

      alert("Please select an audio file.");

      return;
    }

    const fileName =
      Date.now() + "-" +
      file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("music")
        .upload(fileName, file);

    if (uploadError) {

      alert(
        "Upload failed: " +
        uploadError.message
      );

      return;
    }


    const { error: databaseError } =
      await supabaseClient
        .from("songs")
        .insert({

          title: file.name,

          file_path: fileName

        });


    if (databaseError) {

      alert(
        "Music uploaded, but the library record failed: " +
        databaseError.message
      );

      return;
    }


    alert("🎵 Music uploaded successfully!");

    fileInput.value = "";

    loadSongs();

  });


  // =====================================
  // SEARCH
  // =====================================

  search.addEventListener("input", () => {

    displaySongs(search.value);

  });


  // =====================================
  // SECURITY
  // =====================================

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  // =====================================
  // START
  // =====================================

  loadSongs();

</script>

</body>
</html>
