<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding-bottom: 125px;
    }

    header {
      padding: 25px;
      background: #181818;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .upload-box {
      background: #1d1d1d;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    input[type="text"],
    input[type="file"],
    .search {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 15px;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .upload-button {
      background: #16c45b;
      color: white;
      margin-top: 5px;
    }

    .song {
      background: #1d1d1d;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .song-top {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .cover {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .artist {
      color: #aaa;
      margin-bottom: 10px;
    }

    .song audio {
      width: 100%;
    }

    .buttons {
      margin-top: 10px;
    }

    .edit-button {
      background: #2196f3;
      color: white;
      margin-right: 6px;
    }

    .delete-button {
      background: #f44336;
      color: white;
    }

    .edit-box {
      margin-top: 15px;
      padding: 15px;
      background: #252525;
      border-radius: 10px;
    }

    .save-button {
      background: #16c45b;
      color: white;
      margin-right: 6px;
    }

    .cancel-button {
      background: #666;
      color: white;
    }

    .message {
      color: #aaa;
      padding: 20px 0;
      text-align: center;
    }

    .status {
      margin-top: 12px;
      color: #aaa;
    }

    /* =====================================
       PROFESSIONAL MUSIC PLAYER
       ===================================== */

    .player {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      background: #181818;
      border-top: 1px solid #333;
      padding: 10px 20px;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
    }

    .player-progress {
      width: 100%;
      margin-bottom: 8px;
    }

    #progress {
      width: 100%;
      height: 5px;
      cursor: pointer;
      accent-color: #1ed760;
    }

    .player-main {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .player-cover {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      background: #333;
      flex-shrink: 0;
    }

    .player-info {
      width: 180px;
      min-width: 130px;
    }

    .player-title {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      color: #aaa;
      font-size: 13px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
    }

    .player-controls button {
      background: transparent;
      color: white;
      font-size: 18px;
      padding: 8px;
    }

    .player-controls button:hover {
      transform: scale(1.12);
    }

    .play-button {
      background: white !important;
      color: black !important;
      width: 42px;
      height: 42px;
      border-radius: 50% !important;
      font-size: 20px !important;
    }

    .player-extra {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 130px;
      justify-content: flex-end;
    }

    .volume {
      width: 90px;
      accent-color: #1ed760;
    }

    .time {
      color: #aaa;
      font-size: 12px;
      min-width: 80px;
      text-align: center;
    }

    @media (max-width: 700px) {

      .player {
        padding: 8px 10px;
      }

      .player-info {
        width: 120px;
        min-width: 90px;
      }

      .player-extra {
        min-width: auto;
      }

      .volume {
        width: 60px;
      }

      .player-controls {
        gap: 2px;
      }

      .player-controls button {
        padding: 5px;
      }

    }

    @media (max-width: 520px) {

      .player-cover {
        width: 45px;
        height: 45px;
      }

      .player-info {
        width: 100px;
      }

      .player-extra {
        display: none;
      }

      .player-controls button:nth-child(2),
      .player-controls button:nth-child(4) {
        display: none;
      }

    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
  <p>Your personal music streaming library</p>
</header>

<div class="container">

  <!-- UPLOAD -->

  <div class="upload-box">

    <h2>Add New Song</h2>

    <input
      type="text"
      id="songTitle"
      placeholder="Song title"
    >

    <input
      type="text"
      id="artist"
      placeholder="Artist"
    >

    <label><strong>Music file:</strong></label>

    <input
      type="file"
      id="musicFile"
      accept="audio/*"
    >

    <label><strong>Cover image:</strong></label>

    <input
      type="file"
      id="coverFile"
      accept="image/*"
    >

    <button
      class="upload-button"
      id="uploadButton"
    >
      Upload Song
    </button>

    <div
      class="status"
      id="uploadStatus"
    ></div>

  </div>

  <!-- SEARCH -->

  <input
    type="text"
    id="search"
    class="search"
    placeholder="🔎 Search songs or artists..."
  >

  <h2>Your Songs</h2>

  <div id="songs">
    <div class="message">
      Loading your music...
    </div>
  </div>

</div>


<!-- =====================================
     PROFESSIONAL PLAYER
     ===================================== -->

<div class="player">

  <div class="player-progress">
    <input
      type="range"
      id="progress"
      min="0"
      max="100"
      value="0"
    >
  </div>

  <div class="player-main">

    <img
      id="playerCover"
      class="player-cover"
      src=""
      alt="Cover"
    >

    <div class="player-info">

      <div
        id="playerTitle"
        class="player-title"
      >
        Nothing playing
      </div>

      <div
        id="playerArtist"
        class="player-artist"
      >
        —
      </div>

    </div>

    <div class="player-controls">

      <button
        id="shuffleButton"
        title="Shuffle"
      >
        🔀
      </button>

      <button
        id="previousButton"
        title="Previous"
      >
        ⏮️
      </button>

      <button
        id="playButton"
        class="play-button"
        title="Play"
      >
        ▶
      </button>

      <button
        id="nextButton"
        title="Next"
      >
        ⏭️
      </button>

      <button
        id="repeatButton"
        title="Repeat"
      >
        🔁
      </button>

    </div>

    <div class="player-extra">

      <div
        id="timeDisplay"
        class="time"
      >
        0:00 / 0:00
      </div>

      <span>🔊</span>

      <input
        type="range"
        id="volume"
        class="volume"
        min="0"
        max="1"
        step="0.01"
        value="1"
      >

    </div>

  </div>

</div>


<!-- Hidden audio element -->

<audio id="audio"></audio>


<script>

  // =========================================
  // SUPABASE
  // =========================================

  const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================================
  // ELEMENTS
  // =========================================

  const songTitle =
    document.getElementById("songTitle");

  const artist =
    document.getElementById("artist");

  const musicFile =
    document.getElementById("musicFile");

  const coverFile =
    document.getElementById("coverFile");

  const uploadButton =
    document.getElementById("uploadButton");

  const uploadStatus =
    document.getElementById("uploadStatus");

  const songsContainer =
    document.getElementById("songs");

  const search =
    document.getElementById("search");

  const audio =
    document.getElementById("audio");

  const playerCover =
    document.getElementById("playerCover");

  const playerTitle =
    document.getElementById("playerTitle");

  const playerArtist =
    document.getElementById("playerArtist");

  const playButton =
    document.getElementById("playButton");

  const previousButton =
    document.getElementById("previousButton");

  const nextButton =
    document.getElementById("nextButton");

  const shuffleButton =
    document.getElementById("shuffleButton");

  const repeatButton =
    document.getElementById("repeatButton");

  const progress =
    document.getElementById("progress");

  const volume =
    document.getElementById("volume");

  const timeDisplay =
    document.getElementById("timeDisplay");


  let songs = [];

  let currentIndex = -1;

  let shuffle = false;

  let repeat = false;


  // =========================================
  // LOAD SONGS
  // =========================================

  async function loadSongs() {

    songsContainer.innerHTML =
      `<div class="message">Loading your music...</div>`;

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("id", { ascending: false });

    if (error) {

      songsContainer.innerHTML =
        `<div class="message">
          Error loading songs:
          ${escapeHtml(error.message)}
        </div>`;

      return;
    }

    songs = data || [];

    displaySongs();

  }


  // =========================================
  // GET MUSIC URL
  // =========================================

  function getMusicURL(song) {

    if (!song.file_path) {
      return "";
    }

    const { data } =
      supabaseClient
        .storage
        .from("music")
        .getPublicUrl(
          song.file_path
        );

    return data.publicUrl;

  }


  // =========================================
  // DISPLAY SONGS
  // =========================================

  function displaySongs(filter = "") {

    songsContainer.innerHTML = "";

    const searchText =
      filter.toLowerCase().trim();

    const filteredSongs =
      songs.filter(song => {

        const title =
          (song.title || "").toLowerCase();

        const artistName =
          (song.artist || "").toLowerCase();

        return (
          title.includes(searchText) ||
          artistName.includes(searchText)
        );

      });


    if (filteredSongs.length === 0) {

      songsContainer.innerHTML =
        `<div class="message">
          No music found.
        </div>`;

      return;
    }


    filteredSongs.forEach(song => {

      const originalIndex =
        songs.findIndex(
          item => item.id === song.id
        );


      const row =
        document.createElement("div");

      row.className = "song";


      let coverHTML =
        `<div
          class="cover"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:35px;
          "
        >
          🎵
        </div>`;


      if (song.cover_url) {

        coverHTML =
          `<img
            class="cover"
            src="${escapeAttribute(song.cover_url)}"
            alt="Cover"
          >`;

      }


      row.innerHTML = `

        <div class="song-top">

          ${coverHTML}

          <div class="song-info">

            <div class="song-title">
              ${escapeHtml(
                song.title || "Untitled"
              )}
            </div>

            <div class="artist">
              ${escapeHtml(
                song.artist || "Unknown Artist"
              )}
            </div>

            <audio
              controls
              src="${escapeAttribute(
                getMusicURL(song)
              )}"
            ></audio>

          </div>

        </div>

        <div class="buttons">

          <button class="edit-button">
            ✏️ Edit
          </button>

          <button class="delete-button">
            🗑️ Delete
          </button>

        </div>

      `;


      // CLICK SONG AUDIO

      const songAudio =
        row.querySelector("audio");

      songAudio.addEventListener(
        "play",
        () => {

          currentIndex =
            originalIndex;

          loadPlayerSong(
            originalIndex,
            false
          );

        }
      );


      // EDIT

      row
        .querySelector(".edit-button")
        .addEventListener(
          "click",
          () => {

            showEditBox(
              row,
              song
            );

          }
        );


      // DELETE

      row
        .querySelector(".delete-button")
        .addEventListener(
          "click",
          async () => {

            await deleteSong(song);

          }
        );


      songsContainer.appendChild(row);

    });

  }


  // =========================================
  // LOAD SONG INTO PLAYER
  // =========================================

  function loadPlayerSong(
    index,
    autoPlay = true
  ) {

    if (
      index < 0 ||
      index >= songs.length
    ) {
      return;
    }


    currentIndex = index;

    const song =
      songs[index];


    audio.src =
      getMusicURL(song);


    playerTitle.textContent =
      song.title || "Untitled";


    playerArtist.textContent =
      song.artist || "Unknown Artist";


    if (song.cover_url) {

      playerCover.src =
        song.cover_url;

    } else {

      playerCover.removeAttribute(
        "src"
      );

    }


    progress.value = 0;


    if (autoPlay) {

      audio.play()
        .catch(() => {});

    }

  }


  // =========================================
  // PLAY / PAUSE
  // =========================================

  playButton.addEventListener(
    "click",
    () => {

      if (!audio.src) {

        if (songs.length > 0) {

          loadPlayerSong(
            0,
            true
          );

        }

        return;
      }


      if (audio.paused) {

        audio.play();

      } else {

        audio.pause();

      }

    }
  );


  audio.addEventListener(
    "play",
    () => {

      playButton.textContent =
        "⏸";

    }
  );


  audio.addEventListener(
    "pause",
    () => {

      playButton.textContent =
        "▶";

    }
  );


  // =========================================
  // NEXT SONG
  // =========================================

  nextButton.addEventListener(
    "click",
    () => {

      if (songs.length === 0) {
        return;
      }


      let nextIndex;


      if (shuffle) {

        nextIndex =
          Math.floor(
            Math.random() *
            songs.length
          );

      } else {

        nextIndex =
          currentIndex + 1;

        if (
          nextIndex >=
          songs.length
        ) {

          nextIndex = 0;

        }

      }


      loadPlayerSong(
        nextIndex,
        true
      );

    }
  );


  // =========================================
  // PREVIOUS SONG
  // =========================================

  previousButton.addEventListener(
    "click",
    () => {

      if (songs.length === 0) {
        return;
      }


      // Restart current song if
      // already several seconds in

      if (audio.currentTime > 5) {

        audio.currentTime = 0;

        return;

      }


      let previousIndex =
        currentIndex - 1;


      if (
        previousIndex < 0
      ) {

        previousIndex =
          songs.length - 1;

      }


      loadPlayerSong(
        previousIndex,
        true
      );

    }
  );


  // =========================================
  // SONG FINISHED
  // =========================================

  audio.addEventListener(
    "ended",
    () => {

      if (repeat) {

        audio.currentTime = 0;

        audio.play();

        return;

      }


      nextButton.click();

    }
  );


  // =========================================
  // SHUFFLE
  // =========================================

  shuffleButton.addEventListener(
    "click",
    () => {

      shuffle =
        !shuffle;


      shuffleButton.style.opacity =
        shuffle ? "1" : "0.5";

    }
  );


  // =========================================
  // REPEAT
  // =========================================

  repeatButton.addEventListener(
    "click",
    () => {

      repeat =
        !repeat;


      repeatButton.style.opacity =
        repeat ? "1" : "0.5";

    }
  );


  // =========================================
  // PROGRESS BAR
  // =========================================

  audio.addEventListener(
    "timeupdate",
    () => {

      if (!audio.duration) {
        return;
      }


      const percent =
        (
          audio.currentTime /
          audio.duration
        ) * 100;


      progress.value =
        percent;


      timeDisplay.textContent =
        formatTime(
          audio.currentTime
        ) +
        " / " +
        formatTime(
          audio.duration
        );

    }
  );


  progress.addEventListener(
    "input",
    () => {

      if (!audio.duration) {
        return;
      }


      audio.currentTime =
        (
          progress.value / 100
        ) *
        audio.duration;

    }
  );


  // =========================================
  // VOLUME
  // =========================================

  volume.addEventListener(
    "input",
    () => {

      audio.volume =
        volume.value;

    }
  );


  audio.volume = 1;


  // =========================================
  // UPLOAD NEW SONG
  // =========================================

  uploadButton.addEventListener(
    "click",
    async () => {

      const title =
        songTitle.value.trim();

      const artistName =
        artist.value.trim();

      const music =
        musicFile.files[0];

      const cover =
        coverFile.files[0];


      if (!title) {

        alert(
          "Please enter a song title."
        );

        return;

      }


      if (!artistName) {

        alert(
          "Please enter the artist name."
        );

        return;

      }


      if (!music) {

        alert(
          "Please choose a music file."
        );

        return;

      }


      if (!cover) {

        alert(
          "Please choose a cover image."
        );

        return;

      }


      if (!music.type.startsWith("audio/")) {

        alert(
          "Please choose a valid audio file."
        );

        return;

      }


      if (!cover.type.startsWith("image/")) {

        alert(
          "Please choose a valid image file."
        );

        return;

      }


      uploadButton.disabled = true;

      uploadStatus.textContent =
        "Uploading song...";


      try {

        const timestamp =
          Date.now();


        const safeMusicName =
          music.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const safeCoverName =
          cover.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const musicPath =
          timestamp +
          "-" +
          safeMusicName;


        const coverPath =
          "covers/" +
          timestamp +
          "-" +
          safeCoverName;


        // UPLOAD MUSIC

        const {
          error: musicError
        } =
          await supabaseClient
            .storage
            .from("music")
            .upload(
              musicPath,
              music
            );


        if (musicError) {

          throw new Error(
            "Music upload failed: " +
            musicError.message
          );

        }


        // UPLOAD COVER

        uploadStatus.textContent =
          "Uploading cover...";


        const {
          error: coverError
        } =
          await supabaseClient
            .storage
            .from("music")
            .upload(
              coverPath,
              cover
            );


        if (coverError) {

          throw new Error(
            "Cover upload failed: " +
            coverError.message
          );

        }


        // GET COVER URL

        const {
          data: coverData
        } =
          supabaseClient
            .storage
            .from("music")
            .getPublicUrl(
              coverPath
            );


        const coverURL =
          coverData.publicUrl;


        // SAVE DATABASE

        uploadStatus.textContent =
          "Saving song...";


        const {
          error: databaseError
        } =
          await supabaseClient
            .from("songs")
            .insert({

              title: title,

              artist: artistName,

              file_path: musicPath,

              cover_url: coverURL

            });


        if (databaseError) {

          throw new Error(
            databaseError.message
          );

        }


        alert(
          "🎵 Song uploaded successfully!"
        );


        songTitle.value = "";
        artist.value = "";
        musicFile.value = "";
        coverFile.value = "";

        uploadStatus.textContent = "";


        await loadSongs();


      } catch (error) {

        console.error(error);

        alert(
          "Something went wrong:\n\n" +
          error.message
        );

        uploadStatus.textContent = "";

      }


      uploadButton.disabled = false;

    }
  );


  // =========================================
  // EDIT SONG
  // =========================================

  function showEditBox(
    row,
    song
  ) {

    if (
      row.querySelector(".edit-box")
    ) {
      return;
    }


    const editBox =
      document.createElement("div");

    editBox.className =
      "edit-box";


    editBox.innerHTML = `

      <input
        type="text"
        class="edit-title"
        value="${escapeAttribute(
          song.title || ""
        )}"
        placeholder="Song title"
      >

      <input
        type="text"
        class="edit-artist"
        value="${escapeAttribute(
          song.artist || ""
        )}"
        placeholder="Artist"
      >

      <label>
        <strong>New cover image:</strong>
      </label>

      <input
        type="file"
        class="edit-cover"
        accept="image/*"
      >

      <button class="save-button">
        💾 Save Changes
      </button>

      <button class="cancel-button">
        Cancel
      </button>

    `;


    row.appendChild(
      editBox
    );


    editBox
      .querySelector(
        ".cancel-button"
      )
      .addEventListener(
        "click",
        () => {

          editBox.remove();

        }
      );


    editBox
      .querySelector(
        ".save-button"
      )
      .addEventListener(
        "click",
        async () => {

          await saveSongEdit(
            song,
            editBox
          );

        }
      );

  }


  // =========================================
  // SAVE EDIT
  // =========================================

  async function saveSongEdit(
    song,
    editBox
  ) {

    const newTitle =
      editBox
        .querySelector(".edit-title")
        .value
        .trim();


    const newArtist =
      editBox
        .querySelector(".edit-artist")
        .value
        .trim();


    const newCover =
      editBox
        .querySelector(".edit-cover")
        .files[0];


    if (!newTitle) {

      alert(
        "Please enter a song title."
      );

      return;

    }


    if (!newArtist) {

      alert(
        "Please enter an artist."
      );

      return;

    }


    const saveButton =
      editBox
        .querySelector(
          ".save-button"
        );


    saveButton.disabled = true;

    saveButton.textContent =
      "Saving...";


    try {

      let coverURL =
        song.cover_url || null;


      if (newCover) {

        const timestamp =
          Date.now();


        const safeName =
          newCover.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const newCoverPath =
          "covers/" +
          timestamp +
          "-" +
          safeName;


        const {
          error: coverError
        } =
          await supabaseClient
            .storage
            .from("music")
            .upload(
              newCoverPath,
              newCover
            );


        if (coverError) {

          throw new Error(
            "Cover upload failed: " +
            coverError.message
          );

        }


        const {
          data: publicCover
        } =
          supabaseClient
            .storage
            .from("music")
            .getPublicUrl(
              newCoverPath
            );


        coverURL =
          publicCover.publicUrl;

      }


      const {
        error
      } =
        await supabaseClient
          .from("songs")
          .update({

            title: newTitle,

            artist: newArtist,

            cover_url: coverURL

          })
          .eq(
            "id",
            song.id
          );


      if (error) {

        throw new Error(
          error.message
        );

      }


      alert(
        "✅ Song updated successfully!"
      );


      await loadSongs();


    } catch (error) {

      console.error(error);

      alert(
        "Could not save changes:\n\n" +
        error.message
      );


      saveButton.disabled = false;

      saveButton.textContent =
        "💾 Save Changes";

    }

  }


  // =========================================
  // DELETE
  // =========================================

  async function deleteSong(
    song
  ) {

    const confirmed =
      confirm(
        'Are you sure you want to delete "' +
        (song.title || "this song") +
        '"?'
      );


    if (!confirmed) {
      return;
    }


    try {

      if (song.file_path) {

        await supabaseClient
          .storage
          .from("music")
          .remove([
            song.file_path
          ]);

      }


      const {
        error
      } =
        await supabaseClient
          .from("songs")
          .delete()
          .eq(
            "id",
            song.id
          );


      if (error) {

        throw new Error(
          error.message
        );

      }


      alert(
        "🗑️ Song deleted."
      );


      await loadSongs();


    } catch (error) {

      alert(
        "Delete failed:\n\n" +
        error.message
      );

    }

  }


  // =========================================
  // SEARCH
  // =========================================

  search.addEventListener(
    "input",
    () => {

      displaySongs(
        search.value
      );

    }
  );


  // =========================================
  // FORMAT TIME
  // =========================================

  function formatTime(
    seconds
  ) {

    if (
      !seconds ||
      isNaN(seconds)
    ) {

      return "0:00";

    }


    const minutes =
      Math.floor(
        seconds / 60
      );


    const remainingSeconds =
      Math.floor(
        seconds % 60
      );


    return (
      minutes +
      ":" +
      String(
        remainingSeconds
      ).padStart(
        2,
        "0"
      )
    );

  }


  // =========================================
  // SECURITY
  // =========================================

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      text ?? "";

    return div.innerHTML;

  }


  function escapeAttribute(
    text
  ) {

    return String(
      text ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      );

  }


  // =========================================
  // START
  // =========================================

  loadSongs();

</script>
