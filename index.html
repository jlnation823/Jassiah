<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 25px;
      background: #181818;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .upload-box {
      background: #1d1d1d;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    input[type="text"],
    input[type="file"],
    .search {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 15px;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .upload-button {
      background: #16c45b;
      color: white;
      margin-top: 5px;
    }

    .upload-button:hover {
      background: #12a94e;
    }

    .song {
      background: #1d1d1d;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .song-top {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .cover {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .artist {
      color: #aaa;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .buttons {
      margin-top: 10px;
    }

    .edit-button {
      background: #2196f3;
      color: white;
      margin-right: 6px;
    }

    .delete-button {
      background: #f44336;
      color: white;
    }

    .save-button {
      background: #16c45b;
      color: white;
      margin-right: 6px;
    }

    .cancel-button {
      background: #666;
      color: white;
    }

    .edit-box {
      margin-top: 15px;
      padding: 15px;
      background: #252525;
      border-radius: 10px;
    }

    .message {
      color: #aaa;
      padding: 20px 0;
      text-align: center;
    }

    .status {
      margin-top: 12px;
      color: #aaa;
    }

    @media (max-width: 600px) {
      .song-top {
        align-items: flex-start;
      }

      .cover {
        width: 65px;
        height: 65px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
  <p>Your personal music streaming library</p>
</header>

<div class="container">

  <!-- ============================= -->
  <!-- UPLOAD SONG -->
  <!-- ============================= -->

  <div class="upload-box">

    <h2>Add New Song</h2>

    <input
      type="text"
      id="songTitle"
      placeholder="Song title"
    >

    <input
      type="text"
      id="artist"
      placeholder="Artist"
    >

    <label><strong>Music file:</strong></label>

    <input
      type="file"
      id="musicFile"
      accept="audio/*"
    >

    <label><strong>Cover image:</strong></label>

    <input
      type="file"
      id="coverFile"
      accept="image/*"
    >

    <button
      class="upload-button"
      id="uploadButton"
    >
      Upload Song
    </button>

    <div
      class="status"
      id="uploadStatus"
    ></div>

  </div>


  <!-- ============================= -->
  <!-- SEARCH -->
  <!-- ============================= -->

  <input
    type="text"
    id="search"
    class="search"
    placeholder="🔎 Search songs or artists..."
  >


  <h2>Your Songs</h2>

  <div id="songs">
    <div class="message">
      Loading your music...
    </div>
  </div>

</div>


<script>

  // =========================================
  // SUPABASE
  // =========================================

  const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================================
  // ELEMENTS
  // =========================================

  const songTitle =
    document.getElementById("songTitle");

  const artist =
    document.getElementById("artist");

  const musicFile =
    document.getElementById("musicFile");

  const coverFile =
    document.getElementById("coverFile");

  const uploadButton =
    document.getElementById("uploadButton");

  const uploadStatus =
    document.getElementById("uploadStatus");

  const songsContainer =
    document.getElementById("songs");

  const search =
    document.getElementById("search");


  let songs = [];


  // =========================================
  // LOAD SONGS
  // =========================================

  async function loadSongs() {

    songsContainer.innerHTML =
      `<div class="message">Loading your music...</div>`;

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("id", { ascending: false });

    if (error) {

      songsContainer.innerHTML =
        `<div class="message">
          Error loading songs: ${escapeHtml(error.message)}
        </div>`;

      return;
    }

    songs = data || [];

    displaySongs();

  }


  // =========================================
  // DISPLAY SONGS
  // =========================================

  function displaySongs(filter = "") {

    songsContainer.innerHTML = "";

    const searchText =
      filter.toLowerCase().trim();

    const filteredSongs =
      songs.filter(song => {

        const title =
          (song.title || "").toLowerCase();

        const artistName =
          (song.artist || "").toLowerCase();

        return (
          title.includes(searchText) ||
          artistName.includes(searchText)
        );

      });


    if (filteredSongs.length === 0) {

      songsContainer.innerHTML =
        `<div class="message">
          No music found.
        </div>`;

      return;
    }


    filteredSongs.forEach(song => {

      const row =
        document.createElement("div");

      row.className = "song";

      // ---------------------------------------
      // COVER
      // ---------------------------------------

      let coverHTML =
        `<div class="cover"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:35px;
              ">
              🎵
         </div>`;


      if (song.cover_url) {

        coverHTML =
          `<img
             class="cover"
             src="${escapeAttribute(song.cover_url)}"
             alt="Cover"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
           >
           <div
             class="cover"
             style="
               display:none;
               align-items:center;
               justify-content:center;
               font-size:35px;
             "
           >
             🎵
           </div>`;

      }


      // ---------------------------------------
      // MUSIC URL
      // ---------------------------------------

      let musicURL = "";

      if (song.file_path) {

        const { data } =
          supabaseClient
            .storage
            .from("music")
            .getPublicUrl(song.file_path);

        musicURL =
          data.publicUrl;

      }


      row.innerHTML = `

        <div class="song-top">

          ${coverHTML}

          <div class="song-info">

            <div class="song-title">
              ${escapeHtml(song.title || "Untitled")}
            </div>

            <div class="artist">
              ${escapeHtml(song.artist || "Unknown Artist")}
            </div>

            <audio
              controls
              src="${escapeAttribute(musicURL)}"
            ></audio>

          </div>

        </div>

        <div class="buttons">

          <button class="edit-button">
            ✏️ Edit
          </button>

          <button class="delete-button">
            🗑️ Delete
          </button>

        </div>

      `;


      // =====================================
      // EDIT BUTTON
      // =====================================

      row
        .querySelector(".edit-button")
        .addEventListener("click", () => {

          showEditBox(row, song);

        });


      // =====================================
      // DELETE BUTTON
      // =====================================

      row
        .querySelector(".delete-button")
        .addEventListener("click", async () => {

          await deleteSong(song);

        });


      songsContainer.appendChild(row);

    });

  }


  // =========================================
  // UPLOAD NEW SONG
  // =========================================

  uploadButton.addEventListener(
    "click",
    async () => {

      const title =
        songTitle.value.trim();

      const artistName =
        artist.value.trim();

      const music =
        musicFile.files[0];

      const cover =
        coverFile.files[0];


      // ---------------------------------------
      // CHECK SONG
      // ---------------------------------------

      if (!title) {

        alert("Please enter a song title.");

        return;

      }


      if (!artistName) {

        alert("Please enter the artist name.");

        return;

      }


      if (!music) {

        alert("Please choose a music file.");

        return;

      }


      if (!cover) {

        alert("Please choose a cover image.");

        return;

      }


      if (!music.type.startsWith("audio/")) {

        alert("Please choose a valid audio file.");

        return;

      }


      if (!cover.type.startsWith("image/")) {

        alert("Please choose a valid image file.");

        return;

      }


      uploadButton.disabled = true;

      uploadStatus.textContent =
        "Uploading song...";


      try {

        // =====================================
        // CREATE UNIQUE FILE NAMES
        // =====================================

        const timestamp =
          Date.now();

        const safeMusicName =
          music.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        const safeCoverName =
          cover.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const musicPath =
          timestamp +
          "-" +
          safeMusicName;


        const coverPath =
          "covers/" +
          timestamp +
          "-" +
          safeCoverName;


        // =====================================
        // UPLOAD MUSIC
        // =====================================

        uploadStatus.textContent =
          "Uploading music...";


        const {
          error: musicError
        } =
          await supabaseClient
            .storage
            .from("music")
            .upload(
              musicPath,
              music
            );


        if (musicError) {

          throw new Error(
            "Music upload failed: " +
            musicError.message
          );

        }


        // =====================================
        // UPLOAD COVER
        // =====================================

        uploadStatus.textContent =
          "Uploading cover...";


        const {
          error: coverError
        } =
          await supabaseClient
            .storage
            .from("music")
            .upload(
              coverPath,
              cover
            );


        if (coverError) {

          throw new Error(
            "Cover upload failed: " +
            coverError.message
          );

        }


        // =====================================
        // GET COVER URL
        // =====================================

        const {
          data: coverData
        } =
          supabaseClient
            .storage
            .from("music")
            .getPublicUrl(
              coverPath
            );


        const coverURL =
          coverData.publicUrl;


        // =====================================
        // SAVE EVERYTHING TO DATABASE
        // =====================================

        uploadStatus.textContent =
          "Saving song...";


        const {
          error: databaseError
        } =
          await supabaseClient
            .from("songs")
            .insert({

              title: title,

              artist: artistName,

              file_path: musicPath,

              cover_url: coverURL

            });


        if (databaseError) {

          throw new Error(
            "Database error: " +
            databaseError.message
          );

        }


        // =====================================
        // SUCCESS
        // =====================================

        alert(
          "🎵 Song uploaded successfully!"
        );


        songTitle.value = "";
        artist.value = "";
        musicFile.value = "";
        coverFile.value = "";

        uploadStatus.textContent = "";

        await loadSongs();


      } catch (error) {

        console.error(error);

        alert(
          "Something went wrong:\n\n" +
          error.message
        );

        uploadStatus.textContent = "";

      }


      uploadButton.disabled = false;

    }
  );


  // =========================================
  // EDIT SONG
  // =========================================

  function showEditBox(row, song) {

    // Don't create two edit boxes
    if (row.querySelector(".edit-box")) {
      return;
    }


    const editBox =
      document.createElement("div");

    editBox.className =
      "edit-box";


    editBox.innerHTML = `

      <input
        type="text"
        class="edit-title"
        value="${escapeAttribute(song.title || "")}"
        placeholder="Song title"
      >

      <input
        type="text"
        class="edit-artist"
        value="${escapeAttribute(song.artist || "")}"
        placeholder="Artist"
      >

      <label>
        <strong>New cover image:</strong>
      </label>

      <input
        type="file"
        class="edit-cover"
        accept="image/*"
      >

      <button class="save-button">
        💾 Save Changes
      </button>

      <button class="cancel-button">
        Cancel
      </button>

    `;


    row.appendChild(editBox);


    // =====================================
    // CANCEL
    // =====================================

    editBox
      .querySelector(".cancel-button")
      .addEventListener(
        "click",
        () => {

          editBox.remove();

        }
      );


    // =====================================
    // SAVE
    // =====================================

    editBox
      .querySelector(".save-button")
      .addEventListener(
        "click",
        async () => {

          await saveSongEdit(
            song,
            editBox
          );

        }
      );

  }


  // =========================================
  // SAVE EDIT
  // =========================================

  async function saveSongEdit(
    song,
    editBox
  ) {

    const newTitle =
      editBox
        .querySelector(".edit-title")
        .value
        .trim();


    const newArtist =
      editBox
        .querySelector(".edit-artist")
        .value
        .trim();


    const newCover =
      editBox
        .querySelector(".edit-cover")
        .files[0];


    if (!newTitle) {

      alert("Please enter a song title.");

      return;

    }


    if (!newArtist) {

      alert("Please enter an artist.");

      return;

    }


    const saveButton =
      editBox
        .querySelector(".save-button");


    saveButton.disabled = true;

    saveButton.textContent =
      "Saving...";


    try {

      let coverURL =
        song.cover_url || null;


      // =====================================
      // NEW COVER
      // =====================================

      if (newCover) {

        const timestamp =
          Date.now();


        const safeName =
          newCover.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const newCoverPath =
          "covers/" +
          timestamp +
          "-" +
          safeName;


        const {
          error: coverError
        } =
          await supabaseClient
            .storage
            .from("music")
            .upload(
              newCoverPath,
              newCover
            );


        if (coverError) {

          throw new Error(
            "Cover upload failed: " +
            coverError.message
          );

        }


        const {
          data: publicCover
        } =
          supabaseClient
            .storage
            .from("music")
            .getPublicUrl(
              newCoverPath
            );


        coverURL =
          publicCover.publicUrl;

      }


      // =====================================
      // UPDATE DATABASE
      // =====================================

      const {
        error
      } =
        await supabaseClient
          .from("songs")
          .update({

            title: newTitle,

            artist: newArtist,

            cover_url: coverURL

          })
          .eq(
            "id",
            song.id
          );


      if (error) {

        throw new Error(
          error.message
        );

      }


      alert(
        "✅ Song updated successfully!"
      );


      await loadSongs();


    } catch (error) {

      console.error(error);

      alert(
        "Could not save changes:\n\n" +
        error.message
      );

      saveButton.disabled = false;

      saveButton.textContent =
        "💾 Save Changes";

    }

  }


  // =========================================
  // DELETE SONG
  // =========================================

  async function deleteSong(song) {

    const confirmed =
      confirm(
        "Are you sure you want to delete \"" +
        (song.title || "this song") +
        "\"?"
      );


    if (!confirmed) {
      return;
    }


    try {

      // ---------------------------------------
      // DELETE MUSIC FILE
      // ---------------------------------------

      if (song.file_path) {

        await supabaseClient
          .storage
          .from("music")
          .remove([
            song.file_path
          ]);

      }


      // ---------------------------------------
      // DELETE DATABASE RECORD
      // ---------------------------------------

      const {
        error
      } =
        await supabaseClient
          .from("songs")
          .delete()
          .eq(
            "id",
            song.id
          );


      if (error) {

        throw new Error(
          error.message
        );

      }


      alert(
        "🗑️ Song deleted."
      );


      await loadSongs();


    } catch (error) {

      alert(
        "Delete failed:\n\n" +
        error.message
      );

    }

  }


  // =========================================
  // SEARCH
  // =========================================

  search.addEventListener(
    "input",
    () => {

      displaySongs(
        search.value
      );

    }
  );


  // =========================================
  // SECURITY
  // =========================================

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text ?? "";

    return div.innerHTML;

  }


  function escapeAttribute(text) {

    return String(
      text ?? ""
    )
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

  }


  // =========================================
  // START
  // =========================================

  loadSongs();

</script>

</body>
</html>
