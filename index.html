<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jassiah</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.88)),
        url("jassiah.jpg") center top / cover fixed no-repeat;
    background-color: #080808;
}

.overlay {
    min-height: 100vh;
    padding-bottom: 130px;
}

header {
    text-align: center;
    padding: 35px 20px 25px;
}

.logo {
    width: 230px;
    height: 230px;
    object-fit: cover;
    object-position: center 20%;
    border-radius: 50%;
    border: 4px solid #d9a62e;
    box-shadow: 0 0 35px rgba(255,190,50,.35);
    background: #111;
}

h1 {
    margin: 18px 0 5px;
    font-size: 48px;
    letter-spacing: 4px;
    color: #f5c85b;
    text-shadow: 0 3px 15px #000;
}

.subtitle {
    color: #ccc;
    font-size: 15px;
}

.container {
    width: min(900px, 94%);
    margin: auto;
}

.upload-box {
    background: rgba(25,25,25,.94);
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 22px;
}

input[type="text"],
input[type="file"] {
    width: 100%;
    margin: 8px 0;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #202020;
    color: white;
}

input[type="file"] {
    cursor: pointer;
}

label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: bold;
    cursor: pointer;
}

.upload-button {
    background: #19c45b;
    color: white;
    margin-top: 10px;
}

.upload-button:hover {
    background: #12a94d;
}

.search {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 9px;
    border: 1px solid #444;
    background: #181818;
    color: white;
    font-size: 16px;
}

h2 {
    margin-top: 20px;
}

.song {
    display: flex;
    gap: 15px;
    align-items: center;
    background: rgba(27,27,27,.96);
    border-radius: 14px;
    padding: 15px;
    margin: 13px 0;
    border: 1px solid #292929;
}

.cover {
    width: 85px;
    height: 85px;
    min-width: 85px;
    object-fit: cover;
    border-radius: 8px;
    background: #333;
}

.song-info {
    flex: 1;
    min-width: 0;
}

.song-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 4px;
}

.artist {
    color: #aaa;
    margin-bottom: 10px;
}

audio {
    width: 100%;
    height: 40px;
}

.song-buttons {
    margin-top: 8px;
}

.edit-button {
    background: #168ddd;
    color: white;
    margin-right: 6px;
}

.delete-button {
    background: #ef4444;
    color: white;
}

.edit-area {
    margin-top: 12px;
    padding: 12px;
    background: #111;
    border-radius: 10px;
}

.save-button {
    background: #19c45b;
    color: white;
    margin-right: 6px;
}

.cancel-button {
    background: #555;
    color: white;
}

.message {
    text-align: center;
    margin: 15px 0;
    color: #4ade80;
    font-weight: bold;
}

.error {
    color: #ff5555;
}

.empty {
    text-align: center;
    color: #aaa;
    padding: 30px;
}

.now-playing {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(10,10,10,.98);
    border-top: 1px solid #333;
    padding: 10px 18px;
    z-index: 1000;
}

.player-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 15px;
}

.now-cover {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 7px;
}

.now-info {
    width: 190px;
    min-width: 0;
}

.now-title {
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.now-artist {
    color: #aaa;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-controls {
    flex: 1;
}

.player-controls audio {
    width: 100%;
}

@media (max-width: 650px) {

    header {
        padding-top: 25px;
    }

    .logo {
        width: 180px;
        height: 180px;
    }

    h1 {
        font-size: 36px;
    }

    .song {
        align-items: flex-start;
    }

    .cover {
        width: 70px;
        height: 70px;
        min-width: 70px;
    }

    .player-inner {
        gap: 8px;
    }

    .now-info {
        width: 120px;
    }
}
</style>
</head>

<body>

<div class="overlay">

<header>

    <!-- Put your Jassiah picture in the same GitHub folder and name it jassiah.jpg -->
    <img
        class="logo"
        src="jassiah.jpg"
        alt="Jassiah"
        onerror="this.style.display='none'"
    >

    <h1>Jassiah</h1>
    <div class="subtitle">My Music</div>

</header>

<div class="container">

    <div class="upload-box">

        <input
            type="text"
            id="songTitle"
            placeholder="Song title"
        >

        <input
            type="text"
            id="artist"
            placeholder="Artist"
        >

        <label>Music file:</label>
        <input
            type="file"
            id="musicFile"
            accept="audio/*"
        >

        <label>Cover image:</label>
        <input
            type="file"
            id="coverFile"
            accept="image/*"
        >

        <button
            class="upload-button"
            onclick="uploadSong()"
        >
            Upload Song
        </button>

        <div id="uploadMessage" class="message"></div>

    </div>

    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔎 Search songs or artists..."
        oninput="filterSongs()"
    >

    <h2>Your Songs</h2>

    <div id="songs"></div>

</div>

</div>

<!-- Bottom player -->
<div class="now-playing">

    <div class="player-inner">

        <img
            id="nowCover"
            class="now-cover"
            src="jassiah.jpg"
            alt=""
        >

        <div class="now-info">

            <div
                id="nowTitle"
                class="now-title"
            >
                Nothing playing
            </div>

            <div
                id="nowArtist"
                class="now-artist"
            >
                Select a song
            </div>

        </div>

        <div class="player-controls">

            <audio
                id="mainPlayer"
                controls
                preload="metadata"
            ></audio>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONNECTION
   ========================================================= */

const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   GLOBAL SONG DATA
   ========================================================= */

let allSongs = [];


/* =========================================================
   LOAD SONGS
   ========================================================= */

async function loadSongs() {

    const songsContainer =
        document.getElementById("songs");

    songsContainer.innerHTML =
        '<div class="empty">Loading songs...</div>';

    const { data, error } =
        await supabaseClient
            .from("songs")
            .select("*")
            .order("id", { ascending: false });

    if (error) {

        console.error(error);

        songsContainer.innerHTML =
            '<div class="empty error">Could not load songs: '
            + escapeHtml(error.message)
            + '</div>';

        return;
    }

    allSongs = data || [];

    renderSongs(allSongs);
}


/* =========================================================
   RENDER SONGS
   ========================================================= */

function renderSongs(songs) {

    const container =
        document.getElementById("songs");

    if (!songs.length) {

        container.innerHTML =
            '<div class="empty">No songs found.</div>';

        return;
    }

    container.innerHTML = songs.map(song => {

        const cover =
            song.cover_url ||
            "jassiah.jpg";

        const fileUrl =
            getMusicUrl(song);

        return `

        <div class="song" id="song-${song.id}">

            <img
                class="cover"
                src="${escapeAttribute(cover)}"
                onerror="this.src='jassiah.jpg'"
                alt=""
            >

            <div class="song-info">

                <div class="song-title">
                    ${escapeHtml(song.title || "Untitled")}
                </div>

                <div class="artist">
                    ${escapeHtml(song.artist || "Unknown Artist")}
                </div>

                <audio
                    controls
                    preload="metadata"
                    src="${escapeAttribute(fileUrl)}"
                    onplay="setNowPlaying(${song.id})"
                    onerror="audioError(this)"
                ></audio>

                <div class="song-buttons">

                    <button
                        class="edit-button"
                        onclick="showEdit(${song.id})"
                    >
                        ✏️ Edit
                    </button>

                    <button
                        class="delete-button"
                        onclick="deleteSong(${song.id})"
                    >
                        🗑️ Delete
                    </button>

                </div>

                <div
                    id="edit-${song.id}"
                    class="edit-area"
                    style="display:none"
                >

                    <input
                        type="text"
                        id="title-${song.id}"
                        value="${escapeAttribute(song.title || "")}"
                        placeholder="Song title"
                    >

                    <input
                        type="text"
                        id="artist-${song.id}"
                        value="${escapeAttribute(song.artist || "")}"
                        placeholder="Artist"
                    >

                    <label>
                        New cover image:
                    </label>

                    <input
                        type="file"
                        id="cover-${song.id}"
                        accept="image/*"
                    >

                    <button
                        class="save-button"
                        onclick="saveEdit(${song.id})"
                    >
                        Save
                    </button>

                    <button
                        class="cancel-button"
                        onclick="hideEdit(${song.id})"
                    >
                        Cancel
                    </button>

                </div>

            </div>

        </div>

        `;

    }).join("");
}


/* =========================================================
   GET MUSIC URL
   ========================================================= */

function getMusicUrl(song) {

    if (song.music_url) {
        return song.music_url;
    }

    if (song.file_url) {
        return song.file_url;
    }

    if (song.file_path) {

        const result =
            supabaseClient
                .storage
                .from("music")
                .getPublicUrl(song.file_path);

        return result.data.publicUrl;
    }

    return "";
}


/* =========================================================
   UPLOAD SONG
   ========================================================= */

async function uploadSong() {

    const title =
        document.getElementById("songTitle")
            .value
            .trim();

    const artist =
        document.getElementById("artist")
            .value
            .trim();

    const musicInput =
        document.getElementById("musicFile");

    const coverInput =
        document.getElementById("coverFile");

    const message =
        document.getElementById("uploadMessage");

    if (!title || !artist || !musicInput.files.length) {

        message.className = "message error";

        message.textContent =
            "Please enter the title, artist, and music file.";

        return;
    }

    try {

        message.className = "message";
        message.textContent = "Uploading...";

        const musicFile =
            musicInput.files[0];

        const safeMusicName =
            musicFile.name
                .replace(/[^a-zA-Z0-9._-]/g, "_");

        const musicPath =
            "songs/"
            + Date.now()
            + "-"
            + safeMusicName;


        /* Upload music */

        const { error: musicError } =
            await supabaseClient
                .storage
                .from("music")
                .upload(
                    musicPath,
                    musicFile,
                    {
                        upsert: false,
                        contentType: musicFile.type
                    }
                );

        if (musicError) {
            throw new Error(
                "Music upload failed: "
                + musicError.message
            );
        }


        /* Get music URL */

        const musicResult =
            supabaseClient
                .storage
                .from("music")
                .getPublicUrl(musicPath);

        const musicUrl =
            musicResult.data.publicUrl;


        /* Upload cover if selected */

        let coverUrl = null;

        if (coverInput.files.length) {

            const coverFile =
                coverInput.files[0];

            const safeCoverName =
                coverFile.name
                    .replace(/[^a-zA-Z0-9._-]/g, "_");

            const coverPath =
                "covers/"
                + Date.now()
                + "-"
                + safeCoverName;


            const { error: coverError } =
                await supabaseClient
                    .storage
                    .from("music")
                    .upload(
                        coverPath,
                        coverFile,
                        {
                            upsert: false,
                            contentType: coverFile.type
                        }
                    );

            if (coverError) {
                throw new Error(
                    "Cover upload failed: "
                    + coverError.message
                );
            }

            const coverResult =
                supabaseClient
                    .storage
                    .from("music")
                    .getPublicUrl(coverPath);

            coverUrl =
                coverResult.data.publicUrl;
        }


        /* Insert database row */

        const { error: insertError } =
            await supabaseClient
                .from("songs")
                .insert({
                    title: title,
                    artist: artist,
                    file_path: musicPath,
                    cover_url: coverUrl
                });

        if (insertError) {
            throw new Error(
                "Database error: "
                + insertError.message
            );
        }


        message.className = "message";

        message.textContent =
            "Song uploaded successfully! 🎉";


        /* Clear form */

        document.getElementById("songTitle")
            .value = "";

        document.getElementById("artist")
            .value = "";

        musicInput.value = "";

        coverInput.value = "";


        await loadSongs();

    } catch (error) {

        console.error(error);

        message.className =
            "message error";

        message.textContent =
            error.message;
    }
}


/* =========================================================
   EDIT SONG
   ========================================================= */

function showEdit(id) {

    document.getElementById(
        "edit-" + id
    ).style.display = "block";
}


function hideEdit(id) {

    document.getElementById(
        "edit-" + id
    ).style.display = "none";
}


async function saveEdit(id) {

    const title =
        document.getElementById(
            "title-" + id
        ).value.trim();

    const artist =
        document.getElementById(
            "artist-" + id
        ).value.trim();

    const coverInput =
        document.getElementById(
            "cover-" + id
        );

    if (!title || !artist) {

        alert(
            "Please enter a song title and artist."
        );

        return;
    }

    try {

        const updateData = {
            title: title,
            artist: artist
        };


        /* New cover */

        if (coverInput.files.length) {

            const coverFile =
                coverInput.files[0];

            const safeName =
                coverFile.name
                    .replace(/[^a-zA-Z0-9._-]/g, "_");

            const coverPath =
                "covers/"
                + Date.now()
                + "-"
                + safeName;


            const { error: uploadError } =
                await supabaseClient
                    .storage
                    .from("music")
                    .upload(
                        coverPath,
                        coverFile,
                        {
                            upsert: false,
                            contentType: coverFile.type
                        }
                    );

            if (uploadError) {

                alert(
                    "Cover upload failed: "
                    + uploadError.message
                );

                return;
            }


            const result =
                supabaseClient
                    .storage
                    .from("music")
                    .getPublicUrl(coverPath);

            updateData.cover_url =
                result.data.publicUrl;
        }


        const { error } =
            await supabaseClient
                .from("songs")
                .update(updateData)
                .eq("id", id);

        if (error) {

            alert(
                "Could not save changes: "
                + error.message
            );

            return;
        }

        alert(
            "Song updated successfully! 🎉"
        );

        await loadSongs();

    } catch (error) {

        console.error(error);

        alert(
            "Something went wrong: "
            + error.message
        );
    }
}


/* =========================================================
   DELETE SONG
   ========================================================= */

async function deleteSong(id) {

    const song =
        allSongs.find(
            s => Number(s.id) === Number(id)
        );

    if (!song) return;

    const confirmed =
        confirm(
            'Delete "' +
            (song.title || "this song") +
            '"?'
        );

    if (!confirmed) return;


    try {

        /* Delete database record */

        const { error } =
            await supabaseClient
                .from("songs")
                .delete()
                .eq("id", id);

        if (error) {

            alert(
                "Could not delete song: "
                + error.message
            );

            return;
        }

        alert("Song deleted.");

        await loadSongs();

    } catch (error) {

        console.error(error);

        alert(
            "Delete failed: "
            + error.message
        );
    }
}


/* =========================================================
   SEARCH
   ========================================================= */

function filterSongs() {

    const query =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const filtered =
        allSongs.filter(song => {

            const title =
                (song.title || "")
                    .toLowerCase();

            const artist =
                (song.artist || "")
                    .toLowerCase();

            return (
                title.includes(query) ||
                artist.includes(query)
            );

        });

    renderSongs(filtered);
}


/* =========================================================
   NOW PLAYING
   ========================================================= */

function setNowPlaying(id) {

    const song =
        allSongs.find(
            s => Number(s.id) === Number(id)
        );

    if (!song) return;

    document.getElementById(
        "nowTitle"
    ).textContent =
        song.title || "Untitled";

    document.getElementById(
        "nowArtist"
    ).textContent =
        song.artist || "Unknown Artist";

    document.getElementById(
        "nowCover"
    ).src =
        song.cover_url || "jassiah.jpg";

    const mainPlayer =
        document.getElementById("mainPlayer");

    mainPlayer.src =
        getMusicUrl(song);

    mainPlayer.play()
        .catch(() => {});
}


/* =========================================================
   AUDIO ERROR
   ========================================================= */

function audioError(audio) {

    console.error(
        "Audio could not play:",
        audio.src
    );

    alert(
        "The song could not play. " +
        "Check that the music file exists in the Supabase music bucket."
    );
}


/* =========================================================
   SECURITY / HTML ESCAPING
   ========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHtml(value);
}


/* =========================================================
   START
   ========================================================= */

loadSongs();

</script>

</body>
</html>
