<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 145px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #000;
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      max-width: 950px;
      margin: auto;
      padding: 25px;
    }

    .upload-box {
      background: #1b1b1b;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 30px;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 15px;
    }

    input[type="file"] {
      margin: 8px 0 15px;
      width: 100%;
      color: white;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      margin-top: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    .upload-btn {
      background: #1db954;
      color: white;
    }

    .edit-btn {
      background: #3498db;
      color: white;
      margin-right: 6px;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .cancel-btn {
      background: #555;
      color: white;
    }

    #searchBox {
      width: 100%;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 10px;
      border: none;
      background: #222;
      color: white;
      font-size: 16px;
    }

    .song {
      background: #1b1b1b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
      align-items: flex-start;
    }

    .cover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .artist {
      color: #aaa;
      margin-bottom: 10px;
    }

    .song audio {
      width: 100%;
      margin: 5px 0;
    }

    .edit-form {
      display: none;
      background: #242424;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .message {
      margin-top: 12px;
      color: #1db954;
    }

    /* =========================
       BOTTOM MUSIC PLAYER
       ========================= */

    #musicPlayer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 130px;
      background: #181818;
      border-top: 1px solid #333;
      z-index: 99999;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.7);

      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 25px;
    }

    #playerCover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }

    #playerInfo {
      width: 210px;
      min-width: 150px;
      overflow: hidden;
    }

    #playerTitle {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #playerArtist {
      color: #aaa;
      margin-top: 6px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #playerCenter {
      flex: 1;
      min-width: 250px;
    }

    #playerControls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    #playerControls button {
      background: transparent;
      color: white;
      border: none;
      margin: 0;
      padding: 5px;
      font-size: 20px;
    }

    #playPauseBtn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: white !important;
      color: black !important;
      font-size: 22px !important;
    }

    #progressArea {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }

    #progressBar {
      flex: 1;
      cursor: pointer;
      accent-color: #1db954;
    }

    .time {
      color: #aaa;
      font-size: 11px;
      width: 35px;
      text-align: center;
    }

    #volumeArea {
      width: 140px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #volumeBar {
      width: 100px;
      accent-color: #1db954;
      cursor: pointer;
    }

    @media (max-width: 700px) {

      body {
        padding-bottom: 110px;
      }

      .container {
        padding: 15px;
      }

      .song {
        gap: 10px;
      }

      .cover {
        width: 70px;
        height: 70px;
      }

      #musicPlayer {
        height: 105px;
        padding: 8px 10px;
        gap: 8px;
      }

      #playerCover {
        width: 65px;
        height: 65px;
      }

      #playerInfo {
        width: 105px;
        min-width: 90px;
      }

      #playerTitle {
        font-size: 13px;
      }

      #playerArtist {
        font-size: 11px;
      }

      #playerCenter {
        min-width: 0;
      }

      #playerControls {
        gap: 5px;
      }

      #playerControls button {
        font-size: 15px;
      }

      #playPauseBtn {
        width: 40px;
        height: 40px;
        font-size: 18px !important;
      }

      #volumeArea {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
</header>

<div class="container">

  <div class="upload-box">

    <h2>Add New Song</h2>

    <input
      type="text"
      id="songTitle"
      placeholder="Song title"
    >

    <input
      type="text"
      id="artist"
      placeholder="Artist"
    >

    <label>Music file:</label>

    <input
      type="file"
      id="musicFile"
      accept="audio/*"
    >

    <label>Cover image:</label>

    <input
      type="file"
      id="coverFile"
      accept="image/*"
    >

    <button
      class="upload-btn"
      onclick="uploadSong()"
    >
      Upload Song
    </button>

    <div
      id="uploadMessage"
      class="message"
    ></div>

  </div>

  <input
    id="searchBox"
    type="text"
    placeholder="🔎 Search songs or artists..."
    oninput="searchSongs()"
  >

  <h2>Your Songs</h2>

  <div id="songs">
    <p>Loading songs...</p>
  </div>

</div>


<!-- =========================
     BOTTOM PLAYER
     ========================= -->

<div id="musicPlayer">

  <img
    id="playerCover"
    src="https://via.placeholder.com/90?text=Music"
    alt="Cover"
  >

  <div id="playerInfo">

    <div id="playerTitle">
      Select a song
    </div>

    <div id="playerArtist">
      No song playing
    </div>

  </div>

  <div id="playerCenter">

    <div id="playerControls">

      <button onclick="toggleShuffle()" id="shuffleBtn">
        🔀
      </button>

      <button onclick="previousSong()">
        ⏮
      </button>

      <button onclick="togglePlay()" id="playPauseBtn">
        ▶
      </button>

      <button onclick="nextSong()">
        ⏭
      </button>

      <button onclick="toggleRepeat()" id="repeatBtn">
        🔁
      </button>

    </div>

    <div id="progressArea">

      <span
        class="time"
        id="currentTime"
      >
        0:00
      </span>

      <input
        type="range"
        id="progressBar"
        min="0"
        max="100"
        value="0"
        step="0.1"
        oninput="seekSong()"
      >

      <span
        class="time"
        id="duration"
      >
        0:00
      </span>

    </div>

  </div>

  <div id="volumeArea">

    <span>🔊</span>

    <input
      type="range"
      id="volumeBar"
      min="0"
      max="1"
      value="1"
      step="0.01"
      oninput="changeVolume()"
    >

  </div>

</div>


<script>

  /* =========================
     SUPABASE CONNECTION
     ========================= */

  const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     VARIABLES
     ========================= */

  let allSongs = [];

  let currentSongIndex = -1;

  let currentAudio = null;

  let shuffle = false;

  let repeat = false;


  /* =========================
     PLAYER ELEMENTS
     ========================= */

  const playerCover =
    document.getElementById("playerCover");

  const playerTitle =
    document.getElementById("playerTitle");

  const playerArtist =
    document.getElementById("playerArtist");

  const playPauseBtn =
    document.getElementById("playPauseBtn");

  const progressBar =
    document.getElementById("progressBar");

  const currentTime =
    document.getElementById("currentTime");

  const duration =
    document.getElementById("duration");

  const volumeBar =
    document.getElementById("volumeBar");


  /* =========================
     LOAD SONGS
     ========================= */

  async function loadSongs() {

    const {
      data,
      error
    } = await supabaseClient
      .from("songs")
      .select("*")
      .order("id", {
        ascending: false
      });


    if (error) {

      console.error(error);

      document.getElementById("songs").innerHTML =
        "<p>Could not load songs.</p>";

      return;
    }


    allSongs = data || [];

    displaySongs(allSongs);
  }


  /* =========================
     DISPLAY SONGS
     ========================= */

  function displaySongs(songs) {

    const container =
      document.getElementById("songs");

    container.innerHTML = "";


    if (!songs || songs.length === 0) {

      container.innerHTML =
        "<p>No songs uploaded yet.</p>";

      return;
    }


    songs.forEach(song => {

      const div =
        document.createElement("div");

      div.className = "song";

      div.dataset.songId = song.id;


      const cover =
        song.cover_url ||
        "https://via.placeholder.com/90?text=Music";


      div.innerHTML = `

        <img
          class="cover"
          src="${escapeAttribute(cover)}"
          alt="Cover"
        >

        <div class="song-info">

          <div class="song-title">
            ${escapeHtml(
              song.title || "Untitled"
            )}
          </div>

          <div class="artist">
            ${escapeHtml(
              song.artist || "Unknown Artist"
            )}
          </div>

          <audio
            controls
            preload="metadata"
            src="${escapeAttribute(
              song.music_url || ""
            )}"
          ></audio>

          <div>

            <button
              class="edit-btn"
              onclick="showEditForm(${song.id})"
            >
              ✏️ Edit
            </button>

            <button
              class="delete-btn"
              onclick="deleteSong(${song.id})"
            >
              🗑️ Delete
            </button>

          </div>

          <div
            id="edit-${song.id}"
            class="edit-form"
          >

            <input
              id="title-${song.id}"
              type="text"
              value="${escapeAttribute(
                song.title || ""
              )}"
              placeholder="Song title"
            >

            <input
              id="artist-${song.id}"
              type="text"
              value="${escapeAttribute(
                song.artist || ""
              )}"
              placeholder="Artist"
            >

            <label>
              New cover image:
            </label>

            <input
              id="cover-${song.id}"
              type="file"
              accept="image/*"
            >

            <button
              class="upload-btn"
              onclick="saveEdit(${song.id})"
            >
              💾 Save Changes
            </button>

            <button
              class="cancel-btn"
              onclick="hideEditForm(${song.id})"
            >
              Cancel
            </button>

          </div>

        </div>
      `;


      container.appendChild(div);


      const audio =
        div.querySelector("audio");


      audio.addEventListener(
        "play",
        () => {

          const index =
            allSongs.findIndex(
              item =>
                Number(item.id) ===
                Number(song.id)
            );

          startPlayer(
            song,
            index,
            audio
          );

        }
      );


      audio.addEventListener(
        "pause",
        () => {

          if (currentAudio === audio) {

            playPauseBtn.textContent =
              "▶";

          }

        }
      );


      audio.addEventListener(
        "ended",
        () => {

          if (currentAudio === audio) {

            songEnded();

          }

        }
      );

    });

  }


  /* =========================
     START PLAYER
     ========================= */

  function startPlayer(
    song,
    index,
    audio
  ) {

    if (
      currentAudio &&
      currentAudio !== audio
    ) {

      currentAudio.pause();

    }


    currentAudio = audio;

    currentSongIndex = index;


    playerTitle.textContent =
      song.title || "Untitled";

    playerArtist.textContent =
      song.artist || "Unknown Artist";


    playerCover.src =
      song.cover_url ||
      "https://via.placeholder.com/90?text=Music";


    audio.volume =
      volumeBar.value;


    playPauseBtn.textContent =
      "⏸";

  }


  /* =========================
     PLAY SELECTED SONG
     ========================= */

  function playSong(index) {

    if (
      index < 0 ||
      index >= allSongs.length
    ) {
      return;
    }


    const song =
      allSongs[index];


    const card =
      document.querySelector(
        `.song[data-song-id="${song.id}"]`
      );


    if (!card) {

      displaySongs(allSongs);

      setTimeout(
        () => playSong(index),
        100
      );

      return;

    }


    const audio =
      card.querySelector("audio");


    if (!audio) {

      alert(
        "The audio player could not be found."
      );

      return;

    }


    if (
      currentAudio &&
      currentAudio !== audio
    ) {

      currentAudio.pause();

      currentAudio.currentTime = 0;

    }


    currentAudio = audio;

    currentSongIndex = index;


    playerTitle.textContent =
      song.title || "Untitled";

    playerArtist.textContent =
      song.artist || "Unknown Artist";

    playerCover.src =
      song.cover_url ||
      "https://via.placeholder.com/90?text=Music";


    audio.volume =
      volumeBar.value;


    audio.play()
      .then(() => {

        playPauseBtn.textContent =
          "⏸";

      })
      .catch(error => {

        console.error(
          "Playback error:",
          error
        );

        alert(
          "The song could not play. Check that the music file is available in your Supabase music bucket."
        );

      });

  }


  /* =========================
     PLAY / PAUSE
     ========================= */

  function togglePlay() {

    if (!currentAudio) {

      if (allSongs.length > 0) {

        playSong(0);

      }

      return;

    }


    if (currentAudio.paused) {

      currentAudio.play()
        .then(() => {

          playPauseBtn.textContent =
            "⏸";

        })
        .catch(error => {

          console.error(error);

          alert(
            "The song could not play."
          );

        });

    } else {

      currentAudio.pause();

      playPauseBtn.textContent =
        "▶";

    }

  }


  /* =========================
     PREVIOUS
     ========================= */

  function previousSong() {

    if (allSongs.length === 0) {
      return;
    }


    let index =
      currentSongIndex - 1;


    if (index < 0) {

      index =
        allSongs.length - 1;

    }


    playSong(index);

  }


  /* =========================
     NEXT
     ========================= */

  function nextSong() {

    if (allSongs.length === 0) {
      return;
    }


    let index;


    if (shuffle) {

      index =
        Math.floor(
          Math.random() *
          allSongs.length
        );

    } else {

      index =
        currentSongIndex + 1;


      if (
        index >= allSongs.length
      ) {

        index = 0;

      }

    }


    playSong(index);

  }


  /* =========================
     SONG ENDED
     ========================= */

  function songEnded() {

    if (!currentAudio) {
      return;
    }


    if (repeat) {

      currentAudio.currentTime = 0;

      currentAudio.play();

      return;

    }


    nextSong();

  }


  /* =========================
     SHUFFLE
     ========================= */

  function toggleShuffle() {

    shuffle = !shuffle;


    document.getElementById(
      "shuffleBtn"
    ).style.opacity =
      shuffle ? "1" : "0.5";

  }


  /* =========================
     REPEAT
     ========================= */

  function toggleRepeat() {

    repeat = !repeat;


    document.getElementById(
      "repeatBtn"
    ).style.opacity =
      repeat ? "1" : "0.5";

  }


  /* =========================
     PROGRESS
     ========================= */

  function updateProgress() {

    if (!currentAudio) {
      return;
    }


    if (
      currentAudio.duration &&
      !isNaN(currentAudio.duration)
    ) {

      progressBar.value =
        (
          currentAudio.currentTime /
          currentAudio.duration
        ) * 100;

    }


    currentTime.textContent =
      formatTime(
        currentAudio.currentTime
      );

  }


  function updateDuration() {

    if (!currentAudio) {
      return;
    }


    duration.textContent =
      formatTime(
        currentAudio.duration
      );

  }


  function seekSong() {

    if (
      !currentAudio ||
      !currentAudio.duration
    ) {
      return;
    }


    currentAudio.currentTime =
      (
        progressBar.value / 100
      ) *
      currentAudio.duration;

  }


  function changeVolume() {

    if (currentAudio) {

      currentAudio.volume =
        Number(volumeBar.value);

    }

  }


  function formatTime(seconds) {

    if (
      !seconds ||
      isNaN(seconds)
    ) {

      return "0:00";

    }


    const minutes =
      Math.floor(
        seconds / 60
      );


    const secondsLeft =
      Math.floor(
        seconds % 60
      );


    return (
      minutes +
      ":" +
      String(secondsLeft)
        .padStart(2, "0")
    );

  }


  /* =========================
     PLAYER EVENTS
     ========================= */

  setInterval(
    () => {

      if (
        currentAudio &&
        !currentAudio.paused
      ) {

        updateProgress();

      }

    },
    250
  );


  if (currentAudio) {

    currentAudio.addEventListener(
      "loadedmetadata",
      updateDuration
    );

  }


  /* =========================
     SEARCH
     ========================= */

  function searchSongs() {

    const value =
      document
        .getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();


    if (!value) {

      displaySongs(allSongs);

      return;

    }


    const filtered =
      allSongs.filter(song => {

        const title =
          (
            song.title || ""
          ).toLowerCase();

        const artist =
          (
            song.artist || ""
          ).toLowerCase();


        return (
          title.includes(value) ||
          artist.includes(value)
        );

      });


    displaySongs(filtered);

  }


  /* =========================
     EDIT FORM
     ========================= */

  function showEditForm(id) {

    const form =
      document.getElementById(
        `edit-${id}`
      );


    if (form) {

      form.style.display =
        "block";

    }

  }


  function hideEditForm(id) {

    const form =
      document.getElementById(
        `edit-${id}`
      );


    if (form) {

      form.style.display =
        "none";

    }

  }


  /* =========================
     SAVE EDIT
     ========================= */

  async function saveEdit(id) {

    const title =
      document.getElementById(
        `title-${id}`
      ).value.trim();


    const artist =
      document.getElementById(
        `artist-${id}`
      ).value.trim();


    const coverInput =
      document.getElementById(
        `cover-${id}`
      );


    if (!title) {

      alert(
        "Please enter a song title."
      );

      return;

    }


    let updateData = {

      title: title,

      artist: artist

    };


    if (
      coverInput.files.length > 0
    ) {

      const file =
        coverInput.files[0];


      const fileName =
        "covers/" +
        Date.now() +
        "_" +
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("music")
          .upload(
            fileName,
            file,
            {
              upsert: true
            }
          );


      if (uploadError) {

        alert(
          "Cover upload failed: " +
          uploadError.message
        );

        return;

      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("music")
          .getPublicUrl(
            fileName
          );


      updateData.cover_url =
        publicData.publicUrl;

    }


    const {
      error
    } =
      await supabaseClient
        .from("songs")
        .update(updateData)
        .eq("id", id);


    if (error) {

      alert(
        "Could not save changes: " +
        error.message
      );

      return;

    }


    alert(
      "Song updated successfully! 🎉"
    );


    await loadSongs();

  }


  /* =========================
     UPLOAD NEW SONG
     ========================= */

  async function uploadSong() {

    const title =
      document.getElementById(
        "songTitle"
      ).value.trim();


    const artist =
      document.getElementById(
        "artist"
      ).value.trim();


    const musicInput =
      document.getElementById(
        "musicFile"
      );


    const coverInput =
      document.getElementById(
        "coverFile"
      );


    const message =
      document.getElementById(
        "uploadMessage"
      );


    if (
      !title ||
      !artist ||
      musicInput.files.length === 0
    ) {

      message.innerText =
        "Please enter the title, artist, and music file.";

      return;

    }


    message.innerText =
      "Uploading music...";


    const musicFile =
      musicInput.files[0];


    /* MUSIC FILE */

    const musicName =
      "songs/" +
      Date.now() +
      "_" +
      musicFile.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const {
      error: musicError
    } =
      await supabaseClient
        .storage
        .from("music")
        .upload(
          musicName,
          musicFile
        );


    if (musicError) {

      message.innerText =
        "Music upload failed: " +
        musicError.message;

      return;

    }


    const {
      data: musicPublic
    } =
      supabaseClient
        .storage
        .from("music")
        .getPublicUrl(
          musicName
        );


    let coverUrl = "";


    /* COVER */

    if (
      coverInput.files.length > 0
    ) {

      message.innerText =
        "Uploading cover...";


      const coverFile =
        coverInput.files[0];


      const coverName =
        "covers/" +
        Date.now() +
        "_" +
        coverFile.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const {
        error: coverError
      } =
        await supabaseClient
          .storage
          .from("music")
          .upload(
            coverName,
            coverFile
          );


      if (coverError) {

        message.innerText =
          "Cover upload failed: " +
          coverError.message;

        return;

      }


      const {
        data: coverPublic
      } =
        supabaseClient
          .storage
          .from("music")
          .getPublicUrl(
            coverName
          );


      coverUrl =
        coverPublic.publicUrl;

    }


    /* DATABASE */

    message.innerText =
      "Saving song...";


    const {
      error: databaseError
    } =
      await supabaseClient
        .from("songs")
        .insert([
          {
            title: title,
            artist: artist,
            music_url:
              musicPublic.publicUrl,
            cover_url:
              coverUrl
          }
        ]);


    if (databaseError) {

      message.innerText =
        "Database error: " +
        databaseError.message;

      return;

    }


    message.innerText =
      "🎵 Song uploaded successfully!";


    document.getElementById(
      "songTitle"
    ).value = "";

    document.getElementById(
      "artist"
    ).value = "";

    document.getElementById(
      "musicFile"
    ).value = "";

    document.getElementById(
      "coverFile"
    ).value = "";


    await loadSongs();

  }


  /* =========================
     DELETE SONG
     ========================= */

  async function deleteSong(id) {

    if (
      !confirm(
        "Are you sure you want to delete this song?"
      )
    ) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("songs")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Could not delete song: " +
        error.message
      );

      return;

    }


    if (
      currentSongIndex >= 0 &&
      allSongs[
        currentSongIndex
      ] &&
      Number(
        allSongs[currentSongIndex].id
      ) === Number(id)
    ) {

      if (currentAudio) {

        currentAudio.pause();

      }

      currentAudio = null;

      currentSongIndex = -1;

      playerTitle.textContent =
        "Select a song";

      playerArtist.textContent =
        "No song playing";

      playerCover.src =
        "https://via.placeholder.com/90?text=Music";

      playPauseBtn.textContent =
        "▶";

    }


    await loadSongs();

  }


  /* =========================
     SECURITY
     ========================= */

  function escapeHtml(text) {

    return String(text)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(text) {

    return escapeHtml(text);

  }


  /* =========================
     START
     ========================= */

  loadSongs();

</script>
