<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding-bottom: 100px;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin: 30px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .upload-box {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .upload-btn {
      background: #16c75a;
      color: white;
    }

    .upload-btn:hover {
      background: #12a94b;
    }

    .search {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      margin-bottom: 20px;
    }

    .song {
      background: #1c1c1c;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .song-content {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .cover {
      width: 80px;
      height: 80px;
      min-width: 80px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .artist {
      color: #aaa;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
      margin-top: 5px;
    }

    .buttons {
      margin-top: 10px;
    }

    .edit-btn {
      background: #2196f3;
      color: white;
      margin-right: 5px;
    }

    .delete-btn {
      background: #f44336;
      color: white;
    }

    .save-btn {
      background: #16c75a;
      color: white;
      margin-right: 5px;
    }

    .cancel-btn {
      background: #666;
      color: white;
    }

    .edit-box {
      margin-top: 15px;
      padding: 15px;
      background: #222;
      border-radius: 10px;
    }

    .edit-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #111;
      color: white;
      border: 1px solid #444;
      border-radius: 7px;
    }

    .message {
      text-align: center;
      margin: 15px 0;
      color: #16c75a;
      font-weight: bold;
    }

    /* Bottom music player */
    #bottomPlayer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #181818;
      border-top: 1px solid #444;
      padding: 10px 20px;
      display: none;
      z-index: 9999;
    }

    .player-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    #playerCover {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 5px;
      background: #333;
    }

    .player-info {
      width: 180px;
      min-width: 180px;
    }

    #playerTitle {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #playerArtist {
      color: #aaa;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #bottomAudio {
      flex: 1;
    }

    @media (max-width: 650px) {
      .song-content {
        align-items: flex-start;
      }

      .player-info {
        display: none;
      }

      .player-inner {
        gap: 10px;
      }

      #playerCover {
        width: 45px;
        height: 45px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>My Music</h1>

  <div class="upload-box">

    <input
      type="text"
      id="songTitle"
      placeholder="Song title"
    >

    <input
      type="text"
      id="songArtist"
      placeholder="Artist"
    >

    <label>Music file:</label>

    <input
      type="file"
      id="musicFile"
      accept="audio/*"
    >

    <label>Cover image:</label>

    <input
      type="file"
      id="coverFile"
      accept="image/*"
    >

    <button
      class="upload-btn"
      onclick="uploadSong()"
    >
      Upload Song
    </button>

  </div>

  <div id="message" class="message"></div>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔎 Search songs or artists..."
    oninput="displaySongs()"
  >

  <h2>Your Songs</h2>

  <div id="songs"></div>

</div>


<!-- Bottom player -->

<div id="bottomPlayer">

  <div class="player-inner">

    <img
      id="playerCover"
      src=""
      alt="Cover"
    >

    <div class="player-info">

      <div id="playerTitle"></div>

      <div id="playerArtist"></div>

    </div>

    <audio
      id="bottomAudio"
      controls
    ></audio>

  </div>

</div>


<script>

  // =========================================================
  // SUPABASE
  // =========================================================

  const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

  // PASTE YOUR EXISTING PUBLISHABLE KEY BETWEEN THE QUOTES
  const SUPABASE_KEY =
    "PASTE_YOUR_EXISTING_SUPABASE_PUBLISHABLE_KEY_HERE";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================================================
  // SETTINGS
  // =========================================================

  const BUCKET = "music";


  let allSongs = [];


  // =========================================================
  // MAKE MUSIC URL
  // =========================================================

  function getMusicUrl(filePath) {

    if (!filePath) {
      return "";
    }

    const result =
      supabaseClient.storage
        .from(BUCKET)
        .getPublicUrl(filePath);

    return result.data.publicUrl;
  }


  // =========================================================
  // LOAD SONGS
  // =========================================================

  async function loadSongs() {

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("id", { ascending: false });

    if (error) {

      console.error(error);

      document.getElementById("message").textContent =
        "Could not load songs: " + error.message;

      return;
    }

    allSongs = data || [];

    displaySongs();
  }


  // =========================================================
  // DISPLAY SONGS
  // =========================================================

  function displaySongs() {

    const container =
      document.getElementById("songs");

    const search =
      document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    container.innerHTML = "";


    const filteredSongs =
      allSongs.filter(song => {

        const title =
          (song.title || "").toLowerCase();

        const artist =
          (song.artist || "").toLowerCase();

        return (
          title.includes(search) ||
          artist.includes(search)
        );

      });


    filteredSongs.forEach(song => {

      const songDiv =
        document.createElement("div");

      songDiv.className = "song";

      const musicUrl =
        getMusicUrl(song.file_path);


      let coverUrl =
        song.cover_url || "";


      if (!coverUrl) {

        coverUrl =
          "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="300"
                 height="300">
              <rect width="100%" height="100%"
                    fill="#333"/>
              <text x="50%"
                    y="50%"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    font-size="70">
                🎵
              </text>
            </svg>
          `);

      }


      songDiv.innerHTML = `

        <div class="song-content">

          <img
            class="cover"
            src="${escapeHtml(coverUrl)}"
            alt="Cover"
            onerror="this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
              <svg xmlns="http://www.w3.org/2000/svg"
                   width="300"
                   height="300">
                <rect width="100%" height="100%"
                      fill="#333"/>
                <text x="50%"
                      y="50%"
                      text-anchor="middle"
                      dominant-baseline="middle"
                      font-size="70">
                  🎵
                </text>
              </svg>
            `)}'"
          >

          <div class="song-info">

            <div class="song-title">
              ${escapeHtml(song.title || "Untitled")}
            </div>

            <div class="artist">
              ${escapeHtml(song.artist || "Unknown Artist")}
            </div>

            <audio
              controls
              preload="metadata"
              src="${escapeHtml(musicUrl)}"
              onerror="console.log('Music error:', '${escapeHtml(musicUrl)}')"
              onclick="setBottomPlayer(
                '${escapeJs(musicUrl)}',
                '${escapeJs(song.title || "Untitled")}',
                '${escapeJs(song.artist || "Unknown Artist")}',
                '${escapeJs(coverUrl)}'
              )"
            ></audio>

          </div>

        </div>


        <div class="buttons">

          <button
            class="edit-btn"
            onclick="editSong(${song.id})"
          >
            ✏️ Edit
          </button>

          <button
            class="delete-btn"
            onclick="deleteSong(${song.id})"
          >
            🗑️ Delete
          </button>

        </div>

      `;


      container.appendChild(songDiv);

    });

  }


  // =========================================================
  // UPLOAD SONG
  // =========================================================

  async function uploadSong() {

    const title =
      document.getElementById("songTitle")
        .value
        .trim();

    const artist =
      document.getElementById("songArtist")
        .value
        .trim();

    const musicFile =
      document.getElementById("musicFile")
        .files[0];

    const coverFile =
      document.getElementById("coverFile")
        .files[0];


    if (!title) {

      alert("Please enter a song title.");

      return;
    }


    if (!musicFile) {

      alert("Please choose a music file.");

      return;
    }


    try {

      showMessage("Uploading song...");


      // -----------------------------------------
      // MUSIC FILE
      // -----------------------------------------

      const musicPath =
        Date.now() +
        "-" +
        cleanFileName(musicFile.name);


      const musicUpload =
        await supabaseClient.storage
          .from(BUCKET)
          .upload(
            musicPath,
            musicFile,
            {
              cacheControl: "3600",
              upsert: false
            }
          );


      if (musicUpload.error) {

        throw musicUpload.error;

      }


      // -----------------------------------------
      // COVER IMAGE
      // -----------------------------------------

      let coverUrl = null;


      if (coverFile) {

        const coverPath =
          "covers/" +
          Date.now() +
          "-" +
          cleanFileName(coverFile.name);


        const coverUpload =
          await supabaseClient.storage
            .from(BUCKET)
            .upload(
              coverPath,
              coverFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (coverUpload.error) {

          throw coverUpload.error;

        }


        const coverResult =
          supabaseClient.storage
            .from(BUCKET)
            .getPublicUrl(coverPath);


        coverUrl =
          coverResult.data.publicUrl;

      }


      // -----------------------------------------
      // DATABASE
      // -----------------------------------------

      const { error: databaseError } =
        await supabaseClient
          .from("songs")
          .insert({

            title: title,

            artist:
              artist || "Unknown Artist",

            file_path:
              musicPath,

            cover_url:
              coverUrl

          });


      if (databaseError) {

        throw databaseError;

      }


      // -----------------------------------------
      // CLEAR FORM
      // -----------------------------------------

      document.getElementById("songTitle")
        .value = "";

      document.getElementById("songArtist")
        .value = "";

      document.getElementById("musicFile")
        .value = "";

      document.getElementById("coverFile")
        .value = "";


      showMessage("Song uploaded successfully! 🎉");


      await loadSongs();

    }

    catch (error) {

      console.error(error);

      alert(
        "Upload failed:\n\n" +
        error.message
      );

      showMessage("");

    }

  }


  // =========================================================
  // EDIT SONG
  // =========================================================

  function editSong(id) {

    const song =
      allSongs.find(s => s.id === id);

    if (!song) return;


    const songDivs =
      document.querySelectorAll(".song");


    songDivs.forEach(div => {

      const title =
        div.querySelector(".song-title");

      if (
        title &&
        title.textContent.trim() ===
        (song.title || "Untitled").trim()
      ) {

        const editBox =
          document.createElement("div");

        editBox.className =
          "edit-box";


        editBox.innerHTML = `

          <input
            id="edit-title-${id}"
            type="text"
            value="${escapeHtml(song.title || "")}"
            placeholder="Song title"
          >

          <input
            id="edit-artist-${id}"
            type="text"
            value="${escapeHtml(song.artist || "")}"
            placeholder="Artist"
          >

          <label>
            New cover image:
          </label>

          <input
            id="edit-cover-${id}"
            type="file"
            accept="image/*"
          >

          <button
            class="save-btn"
            onclick="saveSong(${id})"
          >
            💾 Save Changes
          </button>

          <button
            class="cancel-btn"
            onclick="loadSongs()"
          >
            Cancel
          </button>

        `;


        div.appendChild(editBox);

      }

    });

  }


  // =========================================================
  // SAVE EDIT
  // =========================================================

  async function saveSong(id) {

    const title =
      document.getElementById(
        `edit-title-${id}`
      ).value.trim();


    const artist =
      document.getElementById(
        `edit-artist-${id}`
      ).value.trim();


    const coverFile =
      document.getElementById(
        `edit-cover-${id}`
      ).files[0];


    if (!title) {

      alert("Please enter a song title.");

      return;
    }


    try {

      showMessage("Saving changes...");


      let coverUrl = null;


      // -----------------------------------------
      // NEW COVER
      // -----------------------------------------

      if (coverFile) {

        const coverPath =
          "covers/" +
          Date.now() +
          "-" +
          cleanFileName(coverFile.name);


        const upload =
          await supabaseClient.storage
            .from(BUCKET)
            .upload(
              coverPath,
              coverFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (upload.error) {

          throw upload.error;

        }


        const result =
          supabaseClient.storage
            .from(BUCKET)
            .getPublicUrl(coverPath);


        coverUrl =
          result.data.publicUrl;

      }


      // -----------------------------------------
      // UPDATE DATABASE
      // -----------------------------------------

      const updateData = {

        title: title,

        artist:
          artist || "Unknown Artist"

      };


      if (coverUrl) {

        updateData.cover_url =
          coverUrl;

      }


      const { error } =
        await supabaseClient
          .from("songs")
          .update(updateData)
          .eq("id", id);


      if (error) {

        throw error;

      }


      showMessage(
        "Song updated successfully! 🎉"
      );


      await loadSongs();

    }

    catch (error) {

      console.error(error);

      alert(
        "Could not save changes:\n\n" +
        error.message
      );

      showMessage("");

    }

  }


  // =========================================================
  // DELETE SONG
  // =========================================================

  async function deleteSong(id) {

    const song =
      allSongs.find(s => s.id === id);


    if (!song) return;


    const confirmed =
      confirm(
        `Delete "${song.title}"?`
      );


    if (!confirmed) return;


    try {

      showMessage("Deleting song...");


      // -----------------------------------------
      // DELETE MUSIC FILE
      // -----------------------------------------

      if (song.file_path) {

        await supabaseClient.storage
          .from(BUCKET)
          .remove([
            song.file_path
          ]);

      }


      // -----------------------------------------
      // DELETE DATABASE RECORD
      // -----------------------------------------

      const { error } =
        await supabaseClient
          .from("songs")
          .delete()
          .eq("id", id);


      if (error) {

        throw error;

      }


      showMessage(
        "Song deleted successfully."
      );


      await loadSongs();

    }

    catch (error) {

      console.error(error);

      alert(
        "Could not delete song:\n\n" +
        error.message
      );

      showMessage("");

    }

  }


  // =========================================================
  // BOTTOM PLAYER
  // =========================================================

  function setBottomPlayer(
    url,
    title,
    artist,
    cover
  ) {

    if (!url) {

      alert(
        "This song does not have a valid music file."
      );

      return;

    }


    document.getElementById(
      "bottomPlayer"
    ).style.display = "block";


    document.getElementById(
      "playerTitle"
    ).textContent = title;


    document.getElementById(
      "playerArtist"
    ).textContent = artist;


    document.getElementById(
      "playerCover"
    ).src = cover;


    const audio =
      document.getElementById(
        "bottomAudio"
      );


    audio.src = url;

  }


  // =========================================================
  // HELPERS
  // =========================================================

  function cleanFileName(name) {

    return name
      .replace(/[^a-zA-Z0-9._-]/g, "_");

  }


  function showMessage(text) {

    document.getElementById(
      "message"
    ).textContent = text;

  }


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeJs(value) {

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/\n/g, "\\n")
      .replace(/\r/g, "\\r");

  }


  // =========================================================
  // START
  // =========================================================

  loadSongs();

</script>

</body>
</html>
