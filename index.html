<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px;
    }

    .upload-box {
      background: #1b1b1b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      margin-top: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .upload-btn {
      background: #1db954;
      color: white;
    }

    .edit-btn {
      background: #3498db;
      color: white;
      margin-right: 8px;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .cancel-btn {
      background: #555;
      color: white;
    }

    .song {
      background: #1b1b1b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .cover {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .artist {
      color: #aaa;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
      margin-top: 5px;
    }

    .edit-form {
      display: none;
      background: #222;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .message {
      margin-top: 10px;
      color: #1db954;
    }

    .search-box {
      margin-bottom: 25px;
    }

    .search-box input {
      margin: 0;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .song {
        align-items: flex-start;
      }

      .cover {
        width: 70px;
        height: 70px;
      }

      .song {
        flex-wrap: wrap;
      }

      .song-info {
        min-width: 200px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
</header>

<div class="container">

  <div class="upload-box">
    <h2>Add New Song</h2>

    <input
      type="text"
      id="songTitle"
      placeholder="Song title"
    >

    <input
      type="text"
      id="artist"
      placeholder="Artist"
    >

    <label>Music file:</label>

    <input
      type="file"
      id="musicFile"
      accept="audio/*"
    >

    <label>Cover image:</label>

    <input
      type="file"
      id="coverFile"
      accept="image/*"
    >

    <button
      class="upload-btn"
      onclick="uploadSong()">
      Upload Song
    </button>

    <div
      id="uploadMessage"
      class="message">
    </div>
  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="text"
      id="search"
      placeholder="🔎 Search songs or artists..."
      oninput="searchSongs()"
    >

  </div>


  <h2>Your Songs</h2>

  <div id="songs"></div>

</div>


<script>

  // =====================================
  // SUPABASE CONNECTION
  // =====================================

  const SUPABASE_URL =
    "https://axkdbcyvuezawgbqjtyq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let allSongs = [];


  // =====================================
  // LOAD SONGS
  // =====================================

  async function loadSongs() {

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      console.error(error);

      document.getElementById("songs").innerHTML =
        "<p>Could not load songs.</p>";

      return;
    }


    allSongs = data || [];

    displaySongs(allSongs);

  }


  // =====================================
  // DISPLAY SONGS
  // =====================================

  function displaySongs(songs) {

    const songsContainer =
      document.getElementById("songs");

    songsContainer.innerHTML = "";


    if (!songs || songs.length === 0) {

      songsContainer.innerHTML =
        "<p>No songs found.</p>";

      return;
    }


    songs.forEach(song => {

      const div =
        document.createElement("div");

      div.className = "song";


      // =====================================
      // COVER
      // =====================================

      const cover =
        song.cover_url ||
        "https://via.placeholder.com/90?text=Music";


      // =====================================
      // MUSIC URL
      // =====================================

      let musicUrl = "";


      if (song.file_path) {

        const { data } =
          supabaseClient
            .storage
            .from("music")
            .getPublicUrl(
              song.file_path
            );

        musicUrl =
          data.publicUrl;
      }


      div.innerHTML = `

        <img
          class="cover"
          src="${escapeAttribute(cover)}"
          alt="Cover"
        >

        <div class="song-info">

          <div class="song-title">
            ${escapeHtml(
              song.title || "Untitled"
            )}
          </div>

          <div class="artist">
            ${escapeHtml(
              song.artist || "Unknown Artist"
            )}
          </div>

          <audio
            controls
            src="${escapeAttribute(musicUrl)}">
          </audio>


          <div>

            <button
              class="edit-btn"
              onclick="showEditForm(${song.id})">
              ✏️ Edit
            </button>

            <button
              class="delete-btn"
              onclick="deleteSong(${song.id})">
              🗑️ Delete
            </button>

          </div>


          <!-- EDIT FORM -->

          <div
            id="edit-${song.id}"
            class="edit-form">

            <input
              id="title-${song.id}"
              type="text"
              value="${escapeAttribute(
                song.title || ""
              )}"
              placeholder="Song title"
            >

            <input
              id="artist-${song.id}"
              type="text"
              value="${escapeAttribute(
                song.artist || ""
              )}"
              placeholder="Artist"
            >

            <label>
              New cover image:
            </label>

            <input
              id="cover-${song.id}"
              type="file"
              accept="image/*"
            >

            <button
              class="upload-btn"
              onclick="saveEdit(${song.id})">
              💾 Save Changes
            </button>

            <button
              class="cancel-btn"
              onclick="hideEditForm(${song.id})">
              Cancel
            </button>

          </div>

        </div>
      `;


      songsContainer.appendChild(div);

    });

  }


  // =====================================
  // SEARCH
  // =====================================

  function searchSongs() {

    const searchText =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if (!searchText) {

      displaySongs(allSongs);

      return;
    }


    const filtered =
      allSongs.filter(song => {

        const title =
          (song.title || "")
            .toLowerCase();

        const artist =
          (song.artist || "")
            .toLowerCase();


        return (
          title.includes(searchText) ||
          artist.includes(searchText)
        );

      });


    displaySongs(filtered);

  }


  // =====================================
  // SHOW EDIT FORM
  // =====================================

  function showEditForm(id) {

    const form =
      document.getElementById(
        `edit-${id}`
      );


    if (form) {

      form.style.display =
        "block";

    }

  }


  // =====================================
  // HIDE EDIT FORM
  // =====================================

  function hideEditForm(id) {

    const form =
      document.getElementById(
        `edit-${id}`
      );


    if (form) {

      form.style.display =
        "none";

    }

  }


  // =====================================
  // SAVE EDIT
  // =====================================

  async function saveEdit(id) {

    const title =
      document
        .getElementById(
          `title-${id}`
        )
        .value
        .trim();


    const artist =
      document
        .getElementById(
          `artist-${id}`
        )
        .value
        .trim();


    const coverInput =
      document.getElementById(
        `cover-${id}`
      );


    let updateData = {

      title: title,

      artist: artist

    };


    // =====================================
    // NEW COVER
    // =====================================

    if (
      coverInput.files.length > 0
    ) {

      const file =
        coverInput.files[0];


      if (
        !file.type.startsWith("image/")
      ) {

        alert(
          "Please select an image file."
        );

        return;
      }


      const fileName =
        "covers/" +
        Date.now() +
        "_" +
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const { error: uploadError } =
        await supabaseClient
          .storage
          .from("music")
          .upload(
            fileName,
            file,
            {
              upsert: true
            }
          );


      if (uploadError) {

        alert(
          "Cover upload failed: " +
          uploadError.message
        );

        return;
      }


      const { data: publicData } =
        supabaseClient
          .storage
          .from("music")
          .getPublicUrl(
            fileName
          );


      updateData.cover_url =
        publicData.publicUrl;

    }


    // =====================================
    // UPDATE DATABASE
    // =====================================

    const { error } =
      await supabaseClient
        .from("songs")
        .update(updateData)
        .eq("id", id);


    if (error) {

      alert(
        "Could not save changes: " +
        error.message
      );

      return;
    }


    alert(
      "Song updated successfully! 🎉"
    );


    loadSongs();

  }


  // =====================================
  // UPLOAD NEW SONG
  // =====================================

  async function uploadSong() {

    const title =
      document
        .getElementById("songTitle")
        .value
        .trim();


    const artist =
      document
        .getElementById("artist")
        .value
        .trim();


    const musicInput =
      document.getElementById(
        "musicFile"
      );


    const coverInput =
      document.getElementById(
        "coverFile"
      );


    const message =
      document.getElementById(
        "uploadMessage"
      );


    if (
      !title ||
      !artist ||
      musicInput.files.length === 0
    ) {

      message.innerText =
        "Please enter the title, artist, and music file.";

      return;
    }


    message.innerText =
      "Uploading...";


    const musicFile =
      musicInput.files[0];


    // =====================================
    // UPLOAD MUSIC
    // =====================================

    const musicName =
      "songs/" +
      Date.now() +
      "_" +
      musicFile.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const { error: musicError } =
      await supabaseClient
        .storage
        .from("music")
        .upload(
          musicName,
          musicFile
        );


    if (musicError) {

      message.innerText =
        "Music upload failed: " +
        musicError.message;

      return;
    }


    // =====================================
    // GET MUSIC URL
    // =====================================

    const { data: musicPublic } =
      supabaseClient
        .storage
        .from("music")
        .getPublicUrl(
          musicName
        );


    // =====================================
    // COVER
    // =====================================

    let coverUrl = "";


    if (
      coverInput.files.length > 0
    ) {

      const coverFile =
        coverInput.files[0];


      const coverName =
        "covers/" +
        Date.now() +
        "_" +
        coverFile.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const { error: coverError } =
        await supabaseClient
          .storage
          .from("music")
          .upload(
            coverName,
            coverFile
          );


      if (coverError) {

        message.innerText =
          "Cover upload failed: " +
          coverError.message;

        return;
      }


      const { data: coverPublic } =
        supabaseClient
          .storage
          .from("music")
          .getPublicUrl(
            coverName
          );


      coverUrl =
        coverPublic.publicUrl;

    }


    // =====================================
    // SAVE TO DATABASE
    // =====================================

    const { error: databaseError } =
      await supabaseClient
        .from("songs")
        .insert([
          {
            title: title,

            file_path:
              musicName,

            artist: artist,

            cover_url:
              coverUrl
          }
        ]);


    if (databaseError) {

      message.innerText =
        "Database error: " +
        databaseError.message;

      return;
    }


    message.innerText =
      "Song uploaded successfully! 🎉";


    // CLEAR FORM

    document.getElementById(
      "songTitle"
    ).value = "";

    document.getElementById(
      "artist"
    ).value = "";

    document.getElementById(
      "musicFile"
    ).value = "";

    document.getElementById(
      "coverFile"
    ).value = "";


    loadSongs();

  }


  // =====================================
  // DELETE SONG
  // =====================================

  async function deleteSong(id) {

    if (
      !confirm(
        "Are you sure you want to delete this song?"
      )
    ) {

      return;
    }


    const { error } =
      await supabaseClient
        .from("songs")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Could not delete song: " +
        error.message
      );

      return;
    }


    alert(
      "Song deleted successfully."
    );


    loadSongs();

  }


  // =====================================
  // SECURITY
  // =====================================

  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(text) {

    return escapeHtml(text);

  }


  // =====================================
  // START
  // =====================================

  loadSongs();

</script>

</body>
</html>
