<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 25px;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      color: #aaa;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px 140px;
    }

    .hero {
      padding: 35px;
      border-radius: 18px;
      background: #222;
      margin-bottom: 25px;
    }

    .hero h2 {
      font-size: 32px;
      margin-top: 0;
    }

    .hero p {
      color: #aaa;
    }

    .upload {
      display: inline-block;
      background: white;
      color: black;
      border: 0;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    input[type="file"] {
      display: none;
    }

    .search {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #222;
      color: white;
      font-size: 16px;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #1d1d1d;
      padding: 15px;
      margin-bottom: 8px;
      border-radius: 10px;
    }

    .song button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: white;
      color: black;
      cursor: pointer;
      font-size: 16px;
    }

    .song-name {
      flex: 1;
      font-weight: bold;
    }

    .message {
      color: #888;
      padding: 30px 0;
      text-align: center;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      border-top: 1px solid #333;
      padding: 15px 20px;
    }

    #nowPlaying {
      margin-bottom: 8px;
      font-weight: bold;
    }

    audio {
      width: 100%;
    }

    @media (max-width: 600px) {
      .hero {
        padding: 25px;
      }

      .hero h2 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 My Music</h1>
  <p>Your personal music streaming library</p>
</header>

<div class="container">

  <div class="hero">
    <h2>Listen to music your way.</h2>
    <p>Upload your music and stream it from your website.</p>

    <label class="upload">
      + Add Music
      <input type="file" id="fileInput" accept="audio/*">
    </label>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Search your music..."
  >

  <div id="songs">
    <div class="message">Loading your music...</div>
  </div>

</div>

<div class="player">
  <div id="nowPlaying">Nothing playing</div>
  <audio id="audio" controls></audio>
</div>

<script>

  // ==========================================
  // SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL =//axkdbcyvuezawgbqjtyq.supabase.co

  const SUPABASE_KEY = _KEY=sb_publishable_O0oXTHsPLxZGD2Wo5ayouw_-a9zJKgn;

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // PAGE ELEMENTS
  // ==========================================

  const fileInput =
    document.getElementById("fileInput");

  const songsContainer =
    document.getElementById("songs");

  const audio =
    document.getElementById("audio");

  const nowPlaying =
    document.getElementById("nowPlaying");

  const search =
    document.getElementById("search");

  let songs = [];


  // ==========================================
  // LOAD SONGS FROM DATABASE
  // ==========================================

  async function loadSongs() {

    songsContainer.innerHTML =
      '<div class="message">Loading your music...</div>';

    const { data, error } =
      await supabaseClient
        .from("songs")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      songsContainer.innerHTML =
        `<div class="message">
          Could not load music.<br><br>
          ${escapeHtml(error.message)}
        </div>`;

      return;
    }

    songs = data || [];

    displaySongs();

  }


  // ==========================================
  // DISPLAY SONGS
  // ==========================================

  function displaySongs(filter = "") {

    songsContainer.innerHTML = "";

    const filteredSongs =
      songs.filter(song =>
        (song.title || "")
          .toLowerCase()
          .includes(filter.toLowerCase())
      );

    if (filteredSongs.length === 0) {

      songsContainer.innerHTML =
        `<div class="message">
          No music uploaded yet.
        </div>`;

      return;
    }

    filteredSongs.forEach(song => {

      const row =
        document.createElement("div");

      row.className = "song";

      row.innerHTML = `
        <button type="button">▶</button>

        <div class="song-name">
          ${escapeHtml(song.title)}
        </div>
      `;

      row.querySelector("button")
        .addEventListener("click", () => {

          playSong(song);

        });

      songsContainer.appendChild(row);

    });

  }


  // ==========================================
  // PLAY SONG
  // ==========================================

  function playSong(song) {

    const { data } =
      supabaseClient
        .storage
        .from("music")
        .getPublicUrl(song.file_path);

    audio.src = data.publicUrl;

    nowPlaying.textContent =
      "Now playing: " + song.title;

    audio.play();

  }


  // ==========================================
  // UPLOAD MUSIC
  // ==========================================

  fileInput.addEventListener(
    "change",
    async function () {

      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      if (!file.type.startsWith("audio/")) {

        alert("Please choose an audio file.");

        fileInput.value = "";

        return;
      }

      nowPlaying.textContent =
        "Uploading: " + file.name;


      // Create a unique filename

      const fileName =
        Date.now() +
        "-" +
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      // Upload file to Supabase Storage

      const { error: uploadError } =
        await supabaseClient
          .storage
          .from("music")
          .upload(
            fileName,
            file
          );


      if (uploadError) {

        alert(
          "Upload failed:\n\n" +
          uploadError.message
        );

        nowPlaying.textContent =
          "Nothing playing";

        fileInput.value = "";

        return;
      }


      // Save song information to database

      const { error: databaseError } =
        await supabaseClient
          .from("songs")
          .insert({

            title: file.name,

            file_path: fileName

          });


      if (databaseError) {

        alert(
          "The file uploaded, but the library record failed:\n\n" +
          databaseError.message
        );

        nowPlaying.textContent =
          "Nothing playing";

        fileInput.value = "";

        return;
      }


      alert(
        "🎵 " +
        file.name +
        " was added to your music library!"
      );

      nowPlaying.textContent =
        "Nothing playing";

      fileInput.value = "";

      loadSongs();

    }
  );


  // ==========================================
  // SEARCH
  // ==========================================

  search.addEventListener(
    "input",
    function () {

      displaySongs(search.value);

    }
  );


  // ==========================================
  // BASIC HTML SAFETY
  // ==========================================

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text || "";

    return div.innerHTML;

  }


  // ==========================================
  // START WEBSITE
  // ==========================================

  loadSongs();

</script>

</body>
</html>
